name: install-test

on:
  push:
  schedule:
    # Daily 06:13 UTC: hash-rot canary (verify-downloads only).
    - cron: '13 6 * * *'
    # Weekly Mon 04:30 UTC: real full-install end-to-end (full-install only).
    - cron: '30 4 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the slow real full-install + Doctor + uninstall job'
        type: boolean
        required: false
        default: false

# Keep the event type in the group key so a push, a workflow_dispatch, and a
# schedule run land in SEPARATE concurrency groups. Pushes and scheduled/
# dispatched runs share a ref (refs/heads/main), and a *starting* run with
# cancel-in-progress=true cancels other in-progress runs in its group -- so
# without the event_name split, merging a PR (a push to main) would cancel an
# in-flight full-install. cancel-in-progress stays push-only, so successive
# pushes supersede each other but never kill a long dispatched/scheduled run.
concurrency:
  group: install-test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. encoding-guard — FAST. Fails if install.ps1 / uninstall.ps1 ever regress
  #    to UTF-8 *without* a BOM while containing non-ASCII (em-dashes). That
  #    exact condition makes Windows PowerShell 5.1 (what install.bat launches)
  #    decode the script as Windows-1252 and abort with a parse error before
  #    running a line — the bug that shipped in v0.5.0. This guard makes the
  #    regression impossible to merge unnoticed.
  # ---------------------------------------------------------------------------
  encoding-guard:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Assert install.ps1 / uninstall.ps1 are UTF-8 with BOM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          foreach ($f in 'tools\install.ps1','tools\uninstall.ps1') {
            $b = [System.IO.File]::ReadAllBytes((Resolve-Path $f))
            $hasBom = ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)
            $nonAscii = ($b | Where-Object { $_ -ge 0x80 }).Count
            Write-Host ("{0}: BOM={1} nonAscii={2}" -f $f, $hasBom, $nonAscii)
            if ((-not $hasBom) -and $nonAscii -gt 0) { $bad += $f }
          }
          if ($bad.Count) {
            Write-Host "FAIL: non-ASCII without a UTF-8 BOM -> WinPS 5.1 will not parse: $($bad -join ', ')" -ForegroundColor Red
            exit 1
          }
          Write-Host "Encoding guard passed." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 1b. wrapper-arg-forwarding — FAST. Regression for the v0.6.0 uninstaller
  #     crash: a no-arg launch (normal double-click) left $InnerArgs = $null, and
  #     `& $Inner @InnerArgs` splatted a lone $null as a POSITIONAL argument.
  #     uninstall.ps1 has only [switch]$Silent (no positional-capable param), so
  #     WinPS 5.1 aborted with "A positional parameter cannot be found that
  #     accepts argument '$null'" BEFORE uninstalling anything. install.ps1 only
  #     dodged it because its [string]$InstallPath positional absorbed the null.
  #     Drives the REAL boot_wrapper.ps1 against a stub inner script whose param
  #     block matches uninstall.ps1 (switch-only), reproducing the exact crash
  #     condition, and asserts it does not recur. The other jobs run install.ps1
  #     directly and never exercise the wrapper's splat, so this is the only
  #     guard for it.
  # ---------------------------------------------------------------------------
  wrapper-arg-forwarding:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: boot_wrapper.ps1 forwards zero inner args without a stray $null
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Assemble a sandbox mirroring the release layout (wrapper and inner
          # scripts together in tools\) so the REAL wrapper's $PSScriptRoot
          # resolution finds our stub as the sibling '<Kind>.ps1'.
          $sandbox = Join-Path $env:RUNNER_TEMP 'wrap-arg-test'
          Remove-Item -Recurse -Force $sandbox -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $sandbox 'tools') | Out-Null
          Copy-Item .\tools\boot_wrapper.ps1 (Join-Path $sandbox 'tools\boot_wrapper.ps1')
          # Stub inner script with uninstall.ps1's exact switch-only signature.
          $stub = @(
            '[CmdletBinding()]'
            'param([switch]$Silent)'
            'Write-Host "STUB-INNER-RAN Silent=$Silent"'
            'exit 0'
          ) -join "`r`n"
          Set-Content -Encoding UTF8 -Path (Join-Path $sandbox 'tools\uninstall.ps1') -Value $stub

          # Launch exactly as uninstall.bat does: WinPS 5.1, -File, positional
          # 'uninstall', NO further args. `type nul |` feeds a closed, empty
          # stdin so the wrapper's final Read-Host returns at once instead of
          # hanging the headless job.
          $wrapper = Join-Path $sandbox 'tools\boot_wrapper.ps1'
          $out = & cmd /c "type nul | powershell.exe -NoProfile -ExecutionPolicy Bypass -File `"$wrapper`" uninstall" 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          Write-Host "wrapper exit code: $rc"

          if ($out -match 'positional parameter cannot be found') {
            Write-Host "FAIL: the stray-`$null splat regressed." -ForegroundColor Red; exit 1
          }
          if ($out -notmatch 'STUB-INNER-RAN') {
            Write-Host "FAIL: inner script never ran through the wrapper." -ForegroundColor Red; exit 1
          }
          if ($rc -ne 0) {
            Write-Host "FAIL: wrapper exited $rc (expected 0)." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: boot_wrapper forwards zero inner args cleanly." -ForegroundColor Green

      - name: boot_wrapper.ps1 forwards NAMED arguments to the right parameters
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Testing only the zero-arg case is precisely why the named-argument
          # bug shipped from v0.3.0 through v0.6.0. `& $script @array` splats
          # POSITIONALLY, so every documented `install.bat -Flag` form was
          # wrong: -Doctor landed in install.ps1's positional [string]
          # $InstallPath (starting a real install into a folder named
          # "-Doctor"), while uninstall.ps1 -- with no positional parameter to
          # absorb it -- aborted outright. This drives the REAL wrapper against
          # stubs shaped like the real scripts and checks where each token
          # actually lands.
          $sandbox = Join-Path $env:RUNNER_TEMP 'wrap-named-test'
          Remove-Item -Recurse -Force $sandbox -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $sandbox 'tools') | Out-Null
          Copy-Item .\tools\boot_wrapper.ps1 (Join-Path $sandbox 'tools\boot_wrapper.ps1')

          # install.ps1's shape: switches PLUS a positional string parameter.
          $inst = @(
            '[CmdletBinding()]'
            'param([switch]$Silent,[switch]$Doctor,[switch]$DryRun,[string]$InstallPath = "")'
            'Write-Host "BOUND Silent=$Silent Doctor=$Doctor DryRun=$DryRun InstallPath=[$InstallPath]"'
            'exit 0'
          ) -join "`r`n"
          Set-Content -Encoding UTF8 -Path (Join-Path $sandbox 'tools\install.ps1') -Value $inst
          # uninstall.ps1's shape: switch-only, nothing to absorb a stray token.
          $unin = @(
            '[CmdletBinding()]'
            'param([switch]$Silent,[switch]$RemoveJunction)'
            'Write-Host "BOUND Silent=$Silent RemoveJunction=$RemoveJunction"'
            'exit 0'
          ) -join "`r`n"
          Set-Content -Encoding UTF8 -Path (Join-Path $sandbox 'tools\uninstall.ps1') -Value $unin

          $wrapper = Join-Path $sandbox 'tools\boot_wrapper.ps1'
          $bad = 0
          function Drive($argline, $expect) {
            $out = & cmd /c "type nul | powershell.exe -NoProfile -ExecutionPolicy Bypass -File `"$wrapper`" $argline" 2>&1 | Out-String
            $line = ($out -split "`r?`n" | Where-Object { $_ -match '^BOUND ' } | Select-Object -First 1)
            $ok = ($line -eq $expect)
            if ($out -match 'positional parameter cannot be found') { $ok = $false }
            if (-not $ok) { $script:bad++ }
            "{0}  {1,-38} {2}" -f $(if($ok){'PASS'}else{'FAIL'}), $argline, $line
            if (-not $ok) { "        expected: $expect" }
          }

          Drive 'uninstall'                          'BOUND Silent=False RemoveJunction=False'
          Drive 'uninstall -Silent'                  'BOUND Silent=True RemoveJunction=False'
          Drive 'uninstall -RemoveJunction -Silent'  'BOUND Silent=True RemoveJunction=True'
          Drive 'install'                            'BOUND Silent=False Doctor=False DryRun=False InstallPath=[]'
          Drive 'install -Silent'                    'BOUND Silent=True Doctor=False DryRun=False InstallPath=[]'
          Drive 'install -Doctor'                    'BOUND Silent=False Doctor=True DryRun=False InstallPath=[]'
          Drive 'install -DryRun -Silent'            'BOUND Silent=True Doctor=False DryRun=True InstallPath=[]'
          Drive 'install -InstallPath C:\Tools\TL'   'BOUND Silent=False Doctor=False DryRun=False InstallPath=[C:\Tools\TL]'
          Drive 'install -Silent -InstallPath C:\Tools\TL' 'BOUND Silent=True Doctor=False DryRun=False InstallPath=[C:\Tools\TL]'
          Drive 'install C:\Tools\TL'                'BOUND Silent=False Doctor=False DryRun=False InstallPath=[C:\Tools\TL]'

          if ($bad) { Write-Host "$bad case(s) failed." -ForegroundColor Red; exit 1 }
          Write-Host "OK: named arguments reach their real parameters through the wrapper." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 1c. unit-helpers — FASTEST. Pure-logic coverage for install.ps1's decision
  #     helpers, with no VM install and no network.
  #
  #     install.ps1 is one long straight-line script, so historically the only
  #     way to test ANY decision it makes was to boot a runner and install. That
  #     is why the update-check comparison shipped broken: it told you to
  #     "update" from v0.6.1 to v0.6.0, and nothing asserted otherwise.
  #
  #     Rather than move the helper into a dot-sourced tools\ library — which
  #     install.ps1 would then DEPEND on at runtime, and a release bundle could
  #     omit (the 2026-06-15 flash-and-die) — this job lifts the function out of
  #     install.ps1 by AST and runs a case table against it. The shipped
  #     artifact stays a single self-contained script; the test still exercises
  #     the real source, and fails loudly if the function is renamed or inlined.
  # ---------------------------------------------------------------------------
  unit-helpers:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Test-IsNewerVersion case table (extracted from install.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                   (Resolve-Path .\tools\install.ps1), [ref]$null, [ref]$null)
          $fn = $ast.FindAll({
                  param($n)
                  $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $n.Name -eq 'Test-IsNewerVersion' }, $true)
          if ($fn.Count -ne 1) {
            Write-Host "FAIL: expected exactly 1 Test-IsNewerVersion definition in install.ps1, found $($fn.Count)." -ForegroundColor Red
            Write-Host "      If it was renamed or inlined, update this job -- do not delete it." -ForegroundColor Red
            exit 1
          }
          . ([scriptblock]::Create($fn[0].Extent.Text))

          # candidate, current, expected-"an update is available"
          $cases = @(
            @('0.6.0',      '0.6.1',  $false),   # the shipped bug: never offer a DOWNGRADE
            @('0.7.0',      '0.6.1',  $true ),
            @('0.6.1',      '0.6.1',  $false),
            @('0.6.10',     '0.6.9',  $true ),   # string compare orders these backwards
            @('0.6.9',      '0.6.10', $false),
            @('1.0',        '0.9.9',  $true ),   # ragged component counts
            @('1.0.0-beta', '0.6.1',  $true ),   # unparseable -> string inequality
            @('',           '0.6.1',  $false),   # empty/absent tag -> never nag
            @($null,        '0.6.1',  $false)
          )
          $bad = 0
          foreach ($c in $cases) {
            $got = Test-IsNewerVersion -Candidate $c[0] -Current $c[1]
            $ok  = ($got -eq $c[2])
            if (-not $ok) { $bad++ }
            "{0}  candidate='{1}' current='{2}' -> {3} (expected {4})" -f `
              $(if ($ok) {'PASS'} else {'FAIL'}), $c[0], $c[1], $got, $c[2]
          }
          if ($bad) { Write-Host "$bad case(s) failed." -ForegroundColor Red; exit 1 }
          Write-Host "OK: all $($cases.Count) version-comparison cases passed." -ForegroundColor Green

      - name: Test-InstallerOwnsJunction case table (extracted from uninstall.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Same AST-extraction trick, and here it is not just convenient: the
          # alternative is creating a real junction at %USERPROFILE%\TeXLib,
          # which on a developer machine is the live link to their library.
          # Testing the decision in isolation keeps that path untouched.
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                   (Resolve-Path .\tools\uninstall.ps1), [ref]$null, [ref]$null)
          $fn = $ast.FindAll({
                  param($n)
                  $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $n.Name -eq 'Test-InstallerOwnsJunction' }, $true)
          if ($fn.Count -ne 1) {
            Write-Host "FAIL: expected exactly 1 Test-InstallerOwnsJunction in uninstall.ps1, found $($fn.Count)." -ForegroundColor Red
            exit 1
          }
          . ([scriptblock]::Create($fn[0].Extent.Text))

          $t = Join-Path $env:RUNNER_TEMP 'junction-cases'
          New-Item -ItemType Directory -Force -Path $t | Out-Null
          $J = 'C:\Users\bob\TeXLib'
          function New-VersionFile($name, $content) {
            $f = Join-Path $t $name
            Set-Content -Path $f -Value $content -Encoding UTF8
            return $f
          }

          # description, VERSION file, expected "installer owns this junction"
          $cases = @(
            @('claims the junction',   (New-VersionFile 'claim.txt' "installer_version=0.6.1`ntexlib_root=C:\Users\bob\TeXLib"), $true ),
            @('trailing backslash',    (New-VersionFile 'slash.txt' "texlib_root=C:\Users\bob\TeXLib\"),                          $true ),
            @('different case',        (New-VersionFile 'case.txt'  "texlib_root=c:\users\bob\texlib"),                           $true ),
            @('surrounding whitespace',(New-VersionFile 'ws.txt'    "texlib_root =  C:\Users\bob\TeXLib  "),                      $true ),
            @('claims another path',   (New-VersionFile 'other.txt' "texlib_root=C:\Users\bob\OneDrive - X, Y\Documents\TeXLib"), $false),
            @('no texlib_root key',    (New-VersionFile 'nokey.txt' "installer_version=0.6.1"),                                   $false),
            @('empty texlib_root',     (New-VersionFile 'empty.txt' "texlib_root="),                                             $false),
            @('VERSION missing',       (Join-Path $t 'nope.txt'),                                                                 $false),
            @('null VersionFile',      $null,                                                                                     $false)
          )
          $bad = 0
          foreach ($c in $cases) {
            $got = Test-InstallerOwnsJunction -JunctionPath $J -VersionFile $c[1]
            $ok  = ($got -eq $c[2])
            if (-not $ok) { $bad++ }
            "{0}  {1,-24} -> {2} (expected {3})" -f $(if ($ok) {'PASS'} else {'FAIL'}), $c[0], $got, $c[2]
          }
          $got = Test-InstallerOwnsJunction -JunctionPath '' -VersionFile $cases[0][1]
          if ($got -ne $false) { Write-Host "FAIL: empty JunctionPath returned $got" -ForegroundColor Red; $bad++ }

          if ($bad) { Write-Host "$bad case(s) failed." -ForegroundColor Red; exit 1 }
          Write-Host "OK: junction-ownership decision holds." -ForegroundColor Green

      - name: ConvertTo-InnerArgumentBinding case table (extracted from boot_wrapper.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                   (Resolve-Path .\tools\boot_wrapper.ps1), [ref]$null, [ref]$null)
          $fn = $ast.FindAll({
                  param($n)
                  $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $n.Name -eq 'ConvertTo-InnerArgumentBinding' }, $true)
          if ($fn.Count -ne 1) {
            Write-Host "FAIL: expected exactly 1 ConvertTo-InnerArgumentBinding, found $($fn.Count)." -ForegroundColor Red
            exit 1
          }
          . ([scriptblock]::Create($fn[0].Extent.Text))

          # Mirrors install.ps1's real parameter shape: switches plus two
          # value-taking parameters, one of which ($InstallPath) is positional
          # and therefore silently absorbed stray tokens before the fix.
          $IsSwitch = @{
            Silent = $true; Doctor = $true; Version = $true; DryRun = $true
            OnlyTeXLib = $true; Sandbox = $true; HideJunction = $true; VerifyDownloads = $true
            InstallPath = $false; TeXLibPath = $false
          }
          $bad = 0
          function Check($desc, $tokens, $expectNamed, $expectPositional) {
            $b = ConvertTo-InnerArgumentBinding -Tokens $tokens -IsSwitch $IsSwitch
            $gotN = ($b.Named.GetEnumerator() | Sort-Object Key | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ','
            $gotP = (@($b.Positional)) -join ','
            $ok = ($gotN -eq $expectNamed) -and ($gotP -eq $expectPositional)
            if (-not $ok) { $script:bad++ }
            "{0}  {1,-34} named[{2}] pos[{3}]" -f $(if($ok){'PASS'}else{'FAIL'}), $desc, $gotN, $gotP
            if (-not $ok) { "        expected named[$expectNamed] pos[$expectPositional]" }
          }

          Check 'no tokens'                 @()                                ''                             ''
          Check 'null tokens'               $null                              ''                             ''
          Check 'single switch'             @('-Silent')                       'Silent=True'                  ''
          Check 'two switches'              @('-DryRun','-Silent')             'DryRun=True,Silent=True'      ''
          Check 'value param'               @('-InstallPath','C:\T')           'InstallPath=C:\T'             ''
          Check 'switch + value param'      @('-Silent','-InstallPath','C:\T') 'InstallPath=C:\T,Silent=True' ''
          Check 'bare positional'           @('C:\T')                          ''                             'C:\T'
          Check 'lowercase name'            @('-silent')                       'Silent=True'                  ''
          Check 'UPPERCASE name'            @('-SILENT')                       'Silent=True'                  ''
          Check 'unique prefix'             @('-Sandb')                        'Sandbox=True'                 ''
          Check 'colon form, value'         @('-InstallPath:C:\T')             'InstallPath=C:\T'             ''
          Check 'colon form, switch $false' @('-Silent:$false')                'Silent=False'                 ''
          Check 'colon form, switch true'   @('-Silent:true')                  'Silent=True'                  ''
          Check 'unknown flag stays named'  @('-Bogus')                        'Bogus=True'                   ''
          Check 'value param at end'        @('-InstallPath')                  'InstallPath=True'             ''
          Check 'value param before flag'   @('-InstallPath','-Silent')        'InstallPath=True,Silent=True' ''
          Check 'positional then switch'    @('C:\T','-Silent')                'Silent=True'                  'C:\T'
          Check 'lone dash is positional'   @('-')                             ''                             '-'
          # -V is ambiguous (Version / VerifyDownloads): forward as-is and let
          # the inner script reject it rather than silently picking one.
          Check 'ambiguous prefix forwarded' @('-V')                           'V=True'                       ''

          if ($bad) { Write-Host "$bad case(s) failed." -ForegroundColor Red; exit 1 }
          Write-Host "OK: argument binding holds across 19 forms." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 2. verify-downloads — FAST hash-rot canary. Runs install.ps1 -VerifyDownloads
  #    (early-exit: downloads each pinned component, checks its SHA256/512, exits
  #    0 all-good / 20 drift) on a clean VM. Catches a vendor silently
  #    repackaging a pinned artifact before it breaks a coworker. Needs NO texlib
  #    bundle: -VerifyDownloads dispatches before pre-flight 7i.
  #    Runs on push, manual dispatch, and the daily 06:13 cron — not the weekly.
  # ---------------------------------------------------------------------------
  verify-downloads:
    if: github.event_name != 'schedule' || github.event.schedule == '13 6 * * *'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Guard — the -VerifyDownloads switch exists
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Fail fast (and legibly) if the switch was removed, rather than let
          # WinPS 5.1's CmdletBinding param-binding error surface as an opaque
          # exit 1 that looks just like a real hash drift.
          if (-not (Select-String -Path .\tools\install.ps1 -Pattern 'VerifyDownloads' -Quiet)) {
            Write-Host "install.ps1 has no -VerifyDownloads switch; the canary cannot run." -ForegroundColor Red
            exit 1
          }

      - name: install.ps1 -VerifyDownloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # -Silent as defense-in-depth: if this mode ever fell through to
          # install logic it still could not block on a Read-Host. WRAPPED=1
          # suppresses the wrapper-style final pause belt-and-suspenders.
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -VerifyDownloads
          $rc = $LASTEXITCODE
          Write-Host "install.ps1 -VerifyDownloads exit code: $rc  (0=all good, 20=drift)"
          exit $rc

  # ---------------------------------------------------------------------------
  # 3. dry-run — FAST sanity check. Pre-flight + plan only, no disk changes.
  #    A stub texlib/ is staged so pre-flight 7i (the only hard bundle gate)
  #    passes; junction logic is observe-only in -DryRun and OneDrive is nulled
  #    so the junction branch is deterministically unreachable.
  #    NOTE: -DryRun runs the FULL pre-flight, including the fatal HEAD check to
  #    https://mirror.ctan.org/ (install.ps1). A transient CTAN mirror outage can
  #    red this job; a dry-run log showing ONLY that HEAD failure is infra flake,
  #    not an installer-logic defect.
  # ---------------------------------------------------------------------------
  dry-run:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Assert source-download guidance when the texlib bundle is missing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''; $env:OneDriveCommercial = ''; $env:OneDriveConsumer = ''
          # No texlib\ staged yet. The checked-out source tree (has .git/.github/
          # tools) is exactly what a coworker gets from "Code -> Download ZIP", so
          # pre-flight must fail non-zero AND tell them to grab the release zip
          # instead -- the real-world failure from 2026-06-15.
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -DryRun 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -eq 0) { Write-Host "FAIL: expected non-zero exit when the bundle is missing" -ForegroundColor Red; exit 1 }
          if ($out -notmatch 'GitHub SOURCE download') { Write-Host "FAIL: source-download guidance not shown" -ForegroundColor Red; exit 1 }
          Write-Host "OK: missing-bundle pre-flight points users to the release zip." -ForegroundColor Green
          # $LASTEXITCODE is still 1 from the intentional non-zero -DryRun above;
          # exit 0 explicitly so the step passes once the assertions hold.
          exit 0

      - name: Stage stub texlib bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # install.ps1 requires a sibling texlib\ dir to clear pre-flight 7i in
          # EVERY mode (incl. -DryRun) or it aborts exit 1. Nothing parses the
          # .sty contents at install time, so a minimal stub suffices. Single-
          # line Set-Content avoids any here-string terminator pitfalls.
          New-Item -ItemType Directory -Force -Path 'texlib\Sublime' | Out-Null
          # 'Unreleased' top entry makes Show-VersionInfo skip the banner.
          Set-Content -Encoding UTF8 -Path 'texlib\CHANGELOG.md' -Value "# Changelog`r`n`r`n## [Unreleased]`r`n- CI stub bundle (not a real release)."

      - name: install.ps1 -DryRun
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          # Null OneDrive for the child so $NeedsUserRootJunction is
          # deterministically false regardless of runner provisioning.
          $env:OneDrive = ''
          $env:OneDriveCommercial = ''
          $env:OneDriveConsumer = ''
          $installRoot = Join-Path $env:RUNNER_TEMP 'TeXLibRoot'
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -DryRun -InstallPath $installRoot
          $rc = $LASTEXITCODE
          Write-Host "install.ps1 -DryRun exit code: $rc"
          if ($rc -ne 0) {
            Write-Host "Expected exit 0 from -DryRun, got $rc" -ForegroundColor Red
          }
          exit $rc

  # ---------------------------------------------------------------------------
  # 4. junction — FAST. Exercises the comma/space library path that the v0.5.0
  #    user-root junction feature exists for. Since 0.6.3 the library lives at
  #    <InstallPath>\Library, so the way to reach that path is an -InstallPath
  #    with a space and a comma in it (before 0.6.3 it was a UNR-style OneDrive
  #    folder name, which no runner has). Runs -OnlyTeXLib (junction + bundle
  #    deploy, NOT the ~30 min TeX Live install), then asserts
  #    %USERPROFILE%\TeXLib is a junction pointing at the library.
  # ---------------------------------------------------------------------------
  junction:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Stage stub texlib bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'texlib\Sublime' | Out-Null
          Set-Content -Encoding UTF8 -Path 'texlib\CHANGELOG.md' -Value "# Changelog`r`n`r`n## [Unreleased]`r`n- CI stub bundle (not a real release)."

      - name: Install to a path with BOTH a space and a comma in it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          # An install root whose path has BOTH a space and a comma, so the
          # library at <root>\Library trips $NeedsUserRootJunction -- kpathsea
          # splits TEXINPUTS on commas and chokes on spaces, and this is the
          # only way to reach that on a runner.
          $dirtyRoot = Join-Path $env:RUNNER_TEMP 'TeXLib Root, Fake Org'
          "DIRTY_ROOT=$dirtyRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:OneDrive = ''
          $env:OneDriveCommercial = ''
          $env:OneDriveConsumer = ''
          # -OnlyTeXLib exercises junction creation + bundle deploy WITHOUT the
          # ~30 min TeX Live full install.
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -OnlyTeXLib -InstallPath $dirtyRoot
          $rc = $LASTEXITCODE
          Write-Host "install.ps1 -Silent -OnlyTeXLib exit code: $rc"
          if ($rc -ne 0) { exit $rc }

      - name: Assert the user-root junction was created correctly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $junction = Join-Path $env:USERPROFILE 'TeXLib'
          if (-not (Test-Path $junction)) {
            Write-Host "FAIL: $junction was not created" -ForegroundColor Red; exit 1
          }
          $item = Get-Item $junction -Force
          if ($item.Attributes -notmatch 'ReparsePoint') {
            Write-Host "FAIL: $junction exists but is not a reparse point (junction)" -ForegroundColor Red; exit 1
          }
          $target = $item.Target; if (-not $target) { $target = $item.LinkTarget }
          $target = ($target -join ';')
          Write-Host "junction target: $target"
          if ($target -and ($target -notlike '*TeXLib Root, Fake Org*')) {
            Write-Host "FAIL: junction points somewhere unexpected" -ForegroundColor Red; exit 1
          }
          # 0.6.3 puts the library under the install root, so the junction has to
          # land on <root>\Library rather than the root itself.
          if ($target -and ($target -notlike '*\Library')) {
            Write-Host "FAIL: junction does not point at the <root>\Library folder" -ForegroundColor Red; exit 1
          }
          # The stub bundle deploys into $TeXLibDir, which was reassigned to the
          # junction -- so it must be visible through it.
          if (-not (Test-Path (Join-Path $junction 'CHANGELOG.md'))) {
            Write-Host "FAIL: stub bundle not visible through the junction" -ForegroundColor Red; exit 1
          }
          Write-Host "OK: %USERPROFILE%\TeXLib is a junction at the comma/space library path; bundle deployed through it." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 4b. reuse-existing-library — FAST. Covers the RETURNING machine, which every
  #     other job misses: they all stage a texlib\ bundle and install once onto a
  #     clean VM, so $UseExistingTeXLib is never true and the Skip/Reinstall
  #     prompts are never reached. Both v0.6.1 install bugs lived in exactly that
  #     gap:
  #
  #       * section 16 deployed the Sublime builder files from $TeXLibDir\Sublime
  #         into $SublimeUserSync -- the SAME directory once Packages\User is
  #         junctioned to it -- so Copy-Item threw "Cannot overwrite the item ...
  #         with itself" and killed the install at exit 10, with every file
  #         already correctly in place.
  #       * the interactive [S]kip/[R]einstall path is dead code under -Silent.
  #
  #     Seeding the install root with empty component dirs makes the installer
  #     skip all four big downloads (TeX Live, Sublime, Sumatra, LaTeXTools), so
  #     this runs a REAL full (non--OnlyTeXLib) install in about a minute. The
  #     end-of-install pdflatex verification only WARNs when the stub bin dir has
  #     no pdflatex.exe, so a stubbed toolchain still exits 0.
  # ---------------------------------------------------------------------------
  reuse-existing-library:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Seed a returning machine (existing library + installed components)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # NOTE: deliberately NO texlib\ bundle here. Bundle absent + library
          # already present is what sets $UseExistingTeXLib.
          $installRoot = Join-Path $env:RUNNER_TEMP 'TeXLibRoot'
          "INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # 0.6.3+ default: the library lives at <InstallPath>\Library. Seeding
          # it THERE is what makes the installer take the reuse-in-place path
          # ($UseExistingTeXLib) rather than the pre-0.6.3 migration path, which
          # legacy-library-migration covers separately. Pre-flight accepts the
          # library once the three core .sty files exist.
          $lib = Join-Path $installRoot 'Library'
          "LIB_ROOT=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path (Join-Path $lib 'Sublime') | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'CHANGELOG.md') -Value "# Changelog`r`n`r`n## [Unreleased]`r`n- CI stub library (not a real release)."
          foreach ($p in 'course-metadata','texlib-build','basic-utilities') {
            $sty = "\NeedsTeXFormat{LaTeX2e}`r`n\ProvidesPackage{$p}[2026/01/01 CI stub]`r`n\endinput"
            Set-Content -Encoding UTF8 -Path (Join-Path $lib "$p.sty") -Value $sty
          }
          # The builder files section 16 deploys. Their presence HERE is what
          # makes source and destination the same path once Packages\User is
          # junctioned to $lib\Sublime.
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'Sublime\texlib_builder.py') -Value '# CI stub builder.'
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'Sublime\TeXLib.sublime-build') -Value '{ "//": "CI stub build." }'
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'Sublime\Default.sublime-commands') -Value '[]'
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'Sublime\LaTeX.sublime-settings') -Value '{ "//": "CI stub settings." }'
          # The native Sublime package. Sublime only loads .py at the TOP level
          # of a package dir, so this must become its own Packages\TeXLib entry;
          # sitting at Packages\User\texlib\ (which the settings junction makes
          # true for free) loads nothing, which is what 0.6.4 and earlier did.
          New-Item -ItemType Directory -Force -Path (Join-Path $lib 'Sublime\texlib') | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'Sublime\texlib\texlib.py') -Value '# CI stub plugin.'

          # Empty component dirs are all the installer's Test-Path detection
          # needs to offer Skip -- no multi-GB downloads. TexLive\2025\bin\
          # windows must exist by that exact name ($TexLiveYear).
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $installRoot 'Sublime Text\Data\Packages\LaTeXTools'), `
            (Join-Path $installRoot 'Sublime Text\Data\Lib\python38\regex'), `
            (Join-Path $installRoot 'Sumatra'), `
            (Join-Path $installRoot 'TexLive\2025\bin\windows') | Out-Null
          # Skips the regex wheel download (section 16a-2 is gated on this file).
          Set-Content -Encoding UTF8 -Path (Join-Path $installRoot 'Sublime Text\Data\Lib\python38\regex\__init__.py') -Value '# CI stub regex.'

      - name: Full install onto the seeded machine (-Silent)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''; $env:OneDriveCommercial = ''; $env:OneDriveConsumer = ''
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -InstallPath $env:INSTALL_ROOT 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          Write-Host "install.ps1 exit code: $rc"

          # Assert on the message as well as the code: a future refactor could
          # swallow the self-copy into a warning and still "pass" on exit 0.
          if ($out -match 'with itself') {
            Write-Host "FAIL: section 16 tried to copy the builder files onto themselves." -ForegroundColor Red; exit 1
          }
          if ($out -notmatch 'Existing TeXLib library detected') {
            Write-Host "FAIL: seed did not put the installer on the `$UseExistingTeXLib path; this job is no longer testing what it claims." -ForegroundColor Red; exit 1
          }
          if ($rc -ne 0) { Write-Host "FAIL: install exited $rc on a returning machine." -ForegroundColor Red; exit $rc }
          Write-Host "OK: full install succeeded reusing an already-synced library." -ForegroundColor Green

      - name: Assert the builder files survived and Packages\User is junctioned
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lib  = $env:LIB_ROOT
          $user = Join-Path $env:INSTALL_ROOT 'Sublime Text\Data\Packages\User'
          if (-not (Test-Path $user)) { Write-Host "FAIL: $user missing" -ForegroundColor Red; exit 1 }
          $item = Get-Item $user -Force
          if ($item.Attributes -notmatch 'ReparsePoint') {
            Write-Host "FAIL: Packages\User is not a junction" -ForegroundColor Red; exit 1
          }
          # Skipping the copy must not mean skipping the outcome: the builder has
          # to be reachable through the junction.
          if (-not (Test-Path (Join-Path $user 'texlib_builder.py'))) {
            Write-Host "FAIL: texlib_builder.py not visible through Packages\User" -ForegroundColor Red; exit 1
          }
          if ((Get-Content (Join-Path $lib 'Sublime\texlib_builder.py') -Raw) -notmatch 'CI stub builder') {
            Write-Host "FAIL: the library's builder file was clobbered" -ForegroundColor Red; exit 1
          }
          # The native package needs its own Packages\TeXLib entry to load at all.
          $plugin = Join-Path $env:INSTALL_ROOT 'Sublime Text\Data\Packages\TeXLib'
          if (-not (Test-Path (Join-Path $plugin 'texlib.py'))) {
            Write-Host "FAIL: the TeXLib Sublime package was not deployed to $plugin" -ForegroundColor Red; exit 1
          }
          if ((Get-Item $plugin -Force).Attributes -notmatch 'ReparsePoint') {
            Write-Host "FAIL: Packages\TeXLib is not a junction, so it will not track library updates" -ForegroundColor Red; exit 1
          }
          Write-Host "OK: builder reachable through the junction; plugin deployed; library intact." -ForegroundColor Green

      - name: Re-run interactively, answering the Skip prompts on stdin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Everything is installed now, so a NON-silent re-run hits all three
          # [S]kip or [R]einstall prompts -- the path a coworker actually walks
          # and the one -Silent can never reach.
          #
          # Answers come from a FILE redirect, not `(echo s&echo s&echo s) |`:
          # cmd's `echo s&` emits a trailing space, so Read-Host would return
          # "s " -- harmless for Skip (anything but R/r skips) but silently
          # wrong the day someone extends this to test the "r" reinstall answer.
          # Redirected stdin is also closed at EOF, so the job cannot hang.
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''; $env:OneDriveCommercial = ''; $env:OneDriveConsumer = ''
          Set-Content -Encoding ascii -Path answers.txt -Value "s`r`ns`r`ns"
          $cmd = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\install.ps1 -InstallPath `"$env:INSTALL_ROOT`" < answers.txt"
          $out = & cmd /c $cmd 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          Write-Host "interactive re-run exit code: $rc"

          if ($out -match 'with itself') {
            Write-Host "FAIL: self-copy regressed on the interactive path." -ForegroundColor Red; exit 1
          }
          # Assert on the Write-Host lines around the prompt, NOT on the prompt
          # text itself: with stdin redirected, Read-Host's prompt goes to the
          # console but never reaches the captured stdout (it shows up only in
          # the Start-Transcript log), so matching it would fail spuriously.
          $seen = ([regex]::Matches($out, 'is already installed\.')).Count
          if ($seen -lt 3) {
            Write-Host "FAIL: expected 3 already-installed prompts (Sublime, Sumatra, TeX Live), saw $seen." -ForegroundColor Red; exit 1
          }
          foreach ($c in 'Skipping Sublime Text','Skipping SumatraPDF','Skipping TeX Live') {
            if ($out -notmatch [regex]::Escape($c)) {
              Write-Host "FAIL: '$c' not reached -- the stdin answer did not take." -ForegroundColor Red; exit 1
            }
          }
          if ($rc -ne 0) { Write-Host "FAIL: interactive re-run exited $rc." -ForegroundColor Red; exit $rc }
          Write-Host "OK: interactive re-run skipped all three components and completed." -ForegroundColor Green

      - name: Teardown through uninstall.bat (zero args, wrapper path)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Deliberately the .bat with NO arguments -- the double-click path, and
          # the exact shape that crashed v0.6.1 ($InnerArgs = $null splatted as a
          # positional into uninstall.ps1's switch-only param block). The other
          # jobs invoke uninstall.ps1 directly and cannot catch this.
          #
          # 'Y' answers the confirmation prompt, again via file redirect: piping
          # `echo Y |` would deliver "Y " and uninstall.ps1 compares -ne "Y", so
          # the run would quietly print "Aborted." and exit 0 -- a green step
          # that uninstalled nothing.
          # Plant an UNCLAIMED junction at %USERPROFILE%\TeXLib first: nothing in
          # VERSION points at it, so it stands in for a developer's own link to
          # their real library. The uninstaller must leave it alone.
          $junction = Join-Path $env:USERPROFILE 'TeXLib'
          $target   = Join-Path $env:RUNNER_TEMP 'not-ours'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $target 'canary.txt') -Value 'must survive'
          if (Test-Path $junction) { [System.IO.Directory]::Delete($junction, $false) }
          New-Item -ItemType Junction -Path $junction -Target $target | Out-Null

          # Answers: the top-level confirmation, then the four per-component
          # questions 0.6.3 asks (Sublime / Sumatra / TeX Live, and the library
          # only when it sits outside the install root -- it does not here, so
          # the fourth line is simply unread).
          Set-Content -Encoding ascii -Path confirm.txt -Value "Y`r`nY`r`nY`r`nY"
          $out = & cmd /c "uninstall.bat -InstallPath `"$env:INSTALL_ROOT`" < confirm.txt" 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          Write-Host "uninstall.bat exit code: $rc"
          if ($out -match 'positional parameter cannot be found') {
            Write-Host "FAIL: the wrapper's stray-`$null splat regressed." -ForegroundColor Red; exit 1
          }
          if ($out -notmatch 'TeXLib-Uninstaller v') {
            Write-Host "FAIL: uninstall.ps1 never got far enough to print its banner." -ForegroundColor Red; exit 1
          }
          if ($out -match 'Aborted\.') {
            Write-Host "FAIL: the confirmation answer did not take; nothing was uninstalled." -ForegroundColor Red; exit 1
          }
          if ($rc -ne 0) { Write-Host "FAIL: uninstall.bat exited $rc." -ForegroundColor Red; exit $rc }

          # The junction guard: an unclaimed junction must survive, and its
          # target must be untouched (Directory::Delete(path,$false) never
          # follows the link, but assert it rather than trust it).
          if (-not (Test-Path $junction)) {
            Write-Host "FAIL: the uninstaller removed a junction it did not create." -ForegroundColor Red; exit 1
          }
          if (-not (Test-Path (Join-Path $target 'canary.txt'))) {
            Write-Host "FAIL: the junction target's contents were deleted." -ForegroundColor Red; exit 1
          }
          if ($out -notmatch 'Leaving .*TeXLib in place') {
            Write-Host "FAIL: no explanation printed for the preserved junction." -ForegroundColor Red; exit 1
          }
          # The whole point of 0.6.3's uninstall rework: the components really go.
          # Before it, the Packages\User junction inside the root made
          # Remove-Item -Recurse throw partway through and leave Sublime and
          # SumatraPDF sitting there.
          foreach ($gone in @('Sublime Text','Sumatra','Library')) {
            if (Test-Path (Join-Path $env:INSTALL_ROOT $gone)) {
              Write-Host "FAIL: $gone survived the uninstall." -ForegroundColor Red; exit 1
            }
          }
          Write-Host "OK: uninstall.bat removed every component and preserved the unclaimed junction." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 4c. legacy-library-migration — FAST. Covers the 0.6.3 relocation. A machine
  #     whose library is still at the pre-0.6.3 Documents\TeXLib must come out of
  #     an install with the library at <InstallPath>\Library, the user's own
  #     Sublime settings carried across, and the old folder byte-for-byte
  #     untouched. No other job reaches this: they all start from a location the
  #     0.6.3 default already agrees with.
  # ---------------------------------------------------------------------------
  legacy-library-migration:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Seed a pre-0.6.3 machine (library in Documents) plus a bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'TeXLibRoot'
          "INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # The pre-0.6.3 location, carrying a settings file that exists ONLY
          # there: finding it at the new location afterwards is what proves the
          # migration ran, rather than the bundle simply being deployed.
          $legacy = Join-Path $env:USERPROFILE 'Documents\TeXLib'
          "LEGACY_LIB=$legacy" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path (Join-Path $legacy 'Sublime') | Out-Null
          foreach ($p in 'course-metadata','texlib-build','basic-utilities') {
            $sty = "\NeedsTeXFormat{LaTeX2e}`r`n\ProvidesPackage{$p}[2026/01/01 CI stub]`r`n\endinput"
            Set-Content -Encoding UTF8 -Path (Join-Path $legacy "$p.sty") -Value $sty
          }
          Set-Content -Encoding UTF8 -Path (Join-Path $legacy 'Sublime\my-keymap.sublime-keymap') -Value '[{ "//": "user keymap that must survive the move" }]'

          # A real bundle, so the install takes the deploy path and the migration
          # is limited to carrying the user's settings across.
          New-Item -ItemType Directory -Force -Path 'texlib\Sublime' | Out-Null
          Set-Content -Encoding UTF8 -Path 'texlib\CHANGELOG.md' -Value "# Changelog`r`n`r`n## [Unreleased]`r`n- CI stub bundle (not a real release)."
          foreach ($p in 'course-metadata','texlib-build','basic-utilities') {
            $sty = "\NeedsTeXFormat{LaTeX2e}`r`n\ProvidesPackage{$p}[2026/01/01 CI stub]`r`n\endinput"
            Set-Content -Encoding UTF8 -Path ("texlib\{0}.sty" -f $p) -Value $sty
          }
          Set-Content -Encoding UTF8 -Path 'texlib\Sublime\texlib_builder.py' -Value '# CI stub builder.'
          Set-Content -Encoding UTF8 -Path 'texlib\Sublime\TeXLib.sublime-build' -Value '{ "//": "CI stub build." }'

          # Empty component dirs so all four big downloads are skipped.
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $installRoot 'Sublime Text\Data\Packages\LaTeXTools'), `
            (Join-Path $installRoot 'Sublime Text\Data\Lib\python38\regex'), `
            (Join-Path $installRoot 'Sumatra'), `
            (Join-Path $installRoot 'TexLive\2025\bin\windows') | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $installRoot 'Sublime Text\Data\Lib\python38\regex\__init__.py') -Value '# CI stub regex.'

      - name: Install onto the pre-0.6.3 machine (-Silent)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''; $env:OneDriveCommercial = ''; $env:OneDriveConsumer = ''
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -InstallPath $env:INSTALL_ROOT 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($out -notmatch 'pre-0\.6\.3 library') {
            Write-Host "FAIL: the legacy library was never detected; this job is not testing what it claims." -ForegroundColor Red; exit 1
          }
          if ($rc -ne 0) { Write-Host "FAIL: install exited $rc." -ForegroundColor Red; exit $rc }

      - name: Assert the settings moved and the old folder is intact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $new = Join-Path $env:INSTALL_ROOT 'Library'
          if (-not (Test-Path (Join-Path $new 'course-metadata.sty'))) {
            Write-Host "FAIL: no library at $new" -ForegroundColor Red; exit 1
          }
          $keymap = Join-Path $new 'Sublime\my-keymap.sublime-keymap'
          if (-not (Test-Path $keymap)) {
            Write-Host "FAIL: the user's keymap did not come across to $keymap" -ForegroundColor Red; exit 1
          }
          if ((Get-Content $keymap -Raw) -notmatch 'must survive the move') {
            Write-Host "FAIL: the keymap at the new location is not the user's." -ForegroundColor Red; exit 1
          }
          # Non-destructive is the promise: the old tree stays exactly as it was.
          foreach ($f in 'course-metadata.sty','Sublime\my-keymap.sublime-keymap') {
            if (-not (Test-Path (Join-Path $env:LEGACY_LIB $f))) {
              Write-Host "FAIL: the migration removed $f from $env:LEGACY_LIB" -ForegroundColor Red; exit 1
            }
          }
          Write-Host "OK: library relocated, settings carried over, pre-0.6.3 folder intact." -ForegroundColor Green

      - name: Teardown with -All, and assert the old folder still survives
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          # -All is the "remove everything" switch, and it removes everything the
          # INSTALL owns. A pre-0.6.3 folder the installer merely read from is
          # not ours to delete, and must survive even this.
          $out = & cmd /c "uninstall.bat -All -Silent -InstallPath `"$env:INSTALL_ROOT`"" 2>&1 | Out-String
          Write-Host $out
          if (Test-Path $env:INSTALL_ROOT) {
            Write-Host "FAIL: -All left $env:INSTALL_ROOT behind." -ForegroundColor Red; exit 1
          }
          if (-not (Test-Path (Join-Path $env:LEGACY_LIB 'course-metadata.sty'))) {
            Write-Host "FAIL: -All deleted the pre-0.6.3 library the installer only read from." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: -All removed the install and left the pre-0.6.3 folder alone." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 4d. junctioned-library-uninstall — FAST. The shape 0.6.4 fixed: a machine
  #     upgraded from <=0.6.2 whose OneDrive path had a comma, so texlib_root is
  #     the %USERPROFILE%\TeXLib JUNCTION and the library is on the far side of
  #     it. Two things have to hold, and 0.6.3 got both wrong in one place:
  #     declining must leave the real library untouched, and accepting must
  #     delete the folder the prompt actually named rather than just the link.
  #     Nothing else covers it -- every other job's library is a real directory.
  # ---------------------------------------------------------------------------
  junctioned-library-uninstall:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Decline the library -- the junction target must survive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sand = Join-Path $env:RUNNER_TEMP 'jlib-decline'
          $root = Join-Path $sand 'root'
          $real = Join-Path $sand 'OneDrive - Fake University, Org\Documents\TeXLib'
          $link = Join-Path $sand 'UserProfile\TeXLib'
          New-Item -ItemType Directory -Force -Path $root, $real, (Split-Path $link -Parent) | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $real 'canary.txt') -Value 'must survive'
          New-Item -ItemType Junction -Path $link -Target $real | Out-Null
          $stamp = @("installer_version=0.6.2", "texlib_root=$link") -join "`r`n"
          Set-Content -Encoding UTF8 -Path (Join-Path $root 'VERSION') -Value $stamp

          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          Set-Content -Encoding ascii -Path answers.txt -Value "Y`r`nn"
          $out = & cmd /c "powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\uninstall.ps1 -InstallPath `"$root`" < answers.txt" 2>&1 | Out-String
          Write-Host $out

          if ($out -match 'PRESERVES') {
            Write-Host "FAIL: the PRESERVES block came back." -ForegroundColor Red; exit 1
          }
          # The prompt must name the TARGET. Naming only the link is how a user
          # says yes to "remove C:\Users\me\TeXLib" and means something else.
          if ($out -notmatch [regex]::Escape($real)) {
            Write-Host "FAIL: the prompt never named the junction target." -ForegroundColor Red; exit 1
          }
          if (-not (Test-Path (Join-Path $real 'canary.txt'))) {
            Write-Host "FAIL: declining the library still destroyed it." -ForegroundColor Red; exit 1
          }
          if (-not (Test-Path $link)) {
            Write-Host "FAIL: declining the library still removed the junction." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: declined, and both the junction and the real library survive." -ForegroundColor Green

      - name: Accept the library -- the junction TARGET must go, not just the link
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sand = Join-Path $env:RUNNER_TEMP 'jlib-accept'
          $root = Join-Path $sand 'root'
          $real = Join-Path $sand 'OneDrive - Fake University, Org\Documents\TeXLib'
          $link = Join-Path $sand 'UserProfile\TeXLib'
          New-Item -ItemType Directory -Force -Path $root, $real, (Split-Path $link -Parent) | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $real 'canary.txt') -Value 'should go'
          New-Item -ItemType Junction -Path $link -Target $real | Out-Null
          $stamp = @("installer_version=0.6.2", "texlib_root=$link") -join "`r`n"
          Set-Content -Encoding UTF8 -Path (Join-Path $root 'VERSION') -Value $stamp

          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          Set-Content -Encoding ascii -Path answers2.txt -Value "Y`r`ny"
          $out = & cmd /c "powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\uninstall.ps1 -InstallPath `"$root`" < answers2.txt" 2>&1 | Out-String
          Write-Host $out

          if (Test-Path $real) {
            Write-Host "FAIL: yes removed only the link; the real library is still there." -ForegroundColor Red; exit 1
          }
          if (Test-Path $link) {
            Write-Host "FAIL: the junction was left dangling." -ForegroundColor Red; exit 1
          }
          # Deleting the library must not take its parent with it.
          if (-not (Test-Path (Split-Path $real -Parent))) {
            Write-Host "FAIL: the library's parent directory was removed too." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: accepted, and exactly the named folder plus the link went." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 4e. repair-mode — FAST. -Repair re-applies configuration to an install that
  #     already exists: no downloads, no components, library untouched. Its whole
  #     value is being the cheap answer to "my associations went weird" or
  #     "Sublime lost the builder", so the things worth asserting are that it
  #     rebuilds what you break, that it stays offline, and that it does not
  #     wander into the library.
  # ---------------------------------------------------------------------------
  repair-mode:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Seed an installed-but-broken machine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'TeXLibRoot'
          "INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $lib = Join-Path $installRoot 'Library'
          "LIB_ROOT=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # A 0.6.3+ layout: library inside the install root, components present.
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $lib 'Sublime\texlib'), `
            (Join-Path $installRoot 'Sublime Text\Data\Packages\LaTeXTools'), `
            (Join-Path $installRoot 'Sublime Text\Data\Lib\python38\regex'), `
            (Join-Path $installRoot 'Sumatra'), `
            (Join-Path $installRoot 'TexLive\2025\bin\windows') | Out-Null
          foreach ($p in 'course-metadata','texlib-build','basic-utilities') {
            $sty = "\NeedsTeXFormat{LaTeX2e}`r`n\ProvidesPackage{$p}[2026/01/01 CI stub]`r`n\endinput"
            Set-Content -Encoding UTF8 -Path (Join-Path $lib "$p.sty") -Value $sty
          }
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'Sublime\texlib_builder.py') -Value '# CI stub builder.'
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'Sublime\texlib\texlib.py')  -Value '# CI stub plugin.'
          Set-Content -Encoding UTF8 -Path (Join-Path $installRoot 'Sublime Text\Data\Lib\python38\regex\__init__.py') -Value '# CI stub regex.'
          Set-Content -Encoding UTF8 -Path (Join-Path $installRoot 'Sublime Text\sublime_text.exe') -Value 'stub'
          # Anything of the user's in the library must come through untouched.
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'CANARY.txt') -Value 'library must not be touched'
          # And the VERSION stamp that tells -Repair there is something to repair.
          $stamp = @("installer_version=0.6.4", "texlib_root=$lib", "sublime_dir=$installRoot\Sublime Text") -join "`r`n"
          Set-Content -Encoding UTF8 -Path (Join-Path $installRoot 'VERSION') -Value $stamp

      - name: install.ps1 -Repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''; $env:OneDriveCommercial = ''; $env:OneDriveConsumer = ''
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Repair -InstallPath $env:INSTALL_ROOT 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) { Write-Host "FAIL: -Repair exited $rc." -ForegroundColor Red; exit $rc }

          # Offline by contract. A -Repair that downloads is just a slow install.
          if ($out -match 'Downloading ') {
            Write-Host "FAIL: -Repair downloaded something." -ForegroundColor Red; exit 1
          }
          if ($out -notmatch 'REPAIR') {
            Write-Host "FAIL: the run did not identify itself as REPAIR mode." -ForegroundColor Red; exit 1
          }
          if ($out -notmatch 'Leaving the TeXLib library') {
            Write-Host "FAIL: -Repair did not say it was leaving the library alone." -ForegroundColor Red; exit 1
          }
          # It has to actually rebuild the configuration.
          $plugin = Join-Path $env:INSTALL_ROOT 'Sublime Text\Data\Packages\TeXLib'
          if (-not (Test-Path (Join-Path $plugin 'texlib.py'))) {
            Write-Host "FAIL: -Repair did not deploy the TeXLib Sublime package." -ForegroundColor Red; exit 1
          }
          $user = Join-Path $env:INSTALL_ROOT 'Sublime Text\Data\Packages\User'
          if ((Get-Item $user -Force).Attributes -notmatch 'ReparsePoint') {
            Write-Host "FAIL: -Repair did not junction Packages\User." -ForegroundColor Red; exit 1
          }
          if (-not (Test-Path (Join-Path $env:LIB_ROOT 'LaTeXTools.sublime-settings'))) {
            Write-Host "FAIL: -Repair did not write LaTeXTools.sublime-settings." -ForegroundColor Red; exit 1
          }
          # And it must not have touched the library it was told to leave alone.
          if (-not (Test-Path (Join-Path $env:LIB_ROOT 'CANARY.txt'))) {
            Write-Host "FAIL: -Repair modified the library." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: -Repair rebuilt the config offline, library untouched." -ForegroundColor Green

      - name: -Repair refuses when there is nothing to repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $empty = Join-Path $env:RUNNER_TEMP 'NoInstallHere'
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Repair -InstallPath $empty 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          # Silently "repairing" a non-existent install would junction
          # Packages\User into a Sublime directory that isn't there.
          if ($rc -eq 0) {
            Write-Host "FAIL: -Repair succeeded against an install that does not exist." -ForegroundColor Red; exit 1
          }
          if ($out -notmatch 'needs an existing install') {
            Write-Host "FAIL: no explanation of why -Repair refused." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: -Repair refused with a clear reason." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 4f. self-update-noop — FAST. -Update reaches the GitHub releases API, so the
  #     one thing CI can check cheaply is that the reach-and-compare half works
  #     and correctly decides to do nothing. Guarded on the version comparison:
  #     if this branch is BEHIND the latest release, -Update would legitimately
  #     download and run a real install, which is not something to do in a
  #     10-minute job -- so that case reports and skips rather than failing.
  # ---------------------------------------------------------------------------
  self-update-noop:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: install.ps1 -Update decides correctly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'

          $ver = (Select-String -Path .\tools\install.ps1 -Pattern '^\$InstallerVersion\s*=\s*"([^"]+)"' |
                  Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "script version: $ver"
          $latest = ''
          try {
            $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/landonfox00/TeXLib-Installer/releases/latest' `
                                     -Headers @{ 'User-Agent' = 'TeXLib-Installer-CI' } -TimeoutSec 30
            $latest = "$($rel.tag_name)" -replace '^v', ''
          } catch {
            Write-Host "releases API unreachable; skipping (network, not a regression)." -ForegroundColor Yellow; exit 0
          }
          Write-Host "latest release: $latest"

          if ([version]$ver -lt [version]$latest) {
            Write-Host "This branch is behind v$latest, so -Update would run a real install. Skipping." -ForegroundColor Yellow
            exit 0
          }

          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Update 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) { Write-Host "FAIL: -Update exited $rc on the no-op path." -ForegroundColor Red; exit $rc }
          if ($out -notmatch 'Already on the latest release') {
            Write-Host "FAIL: -Update did not take the no-op path." -ForegroundColor Red; exit 1
          }
          if ($out -match 'Downloading ') {
            Write-Host "FAIL: -Update downloaded despite being current." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: -Update reached the API, compared versions, and did nothing." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 5. package-integrity — FAST. Builds an actual release bundle with
  #    make-release.ps1 and asserts it contains every file install.bat /
  #    uninstall.bat invoke, catching packaging gaps the other jobs miss because
  #    they run install.ps1 directly. Born from the 2026-06-15 flash-and-die:
  #    make-release omitted tools\install_wrapper.ps1, which install.bat invokes.
  #    (Actually launching install.bat headlessly is flaky -- the wrapper's
  #    Read-Host -- so that path is covered by the manual SMOKE-TEST.md instead.)
  # ---------------------------------------------------------------------------
  package-integrity:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Build a release bundle and launch install.bat from it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # make-release snapshots a texlib library; a stub suffices to check
          # PACKAGING completeness and that install.bat launches.
          $stub = Join-Path $env:RUNNER_TEMP 'texlib-src'
          New-Item -ItemType Directory -Force -Path $stub | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $stub 'CHANGELOG.md') -Value "# Changelog`r`n`r`n## [Unreleased]`r`n- stub"
          $out = Join-Path $env:RUNNER_TEMP 'rel'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\make-release.ps1 -Version 0.0.0-ci -TexLibPath $stub -OutDir $out
          if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: make-release exited $LASTEXITCODE" -ForegroundColor Red; exit 1 }
          $stage = Join-Path $out 'TeXLib-Installer-v0.0.0-ci'

          # Every file install.bat / uninstall.bat invoke must ship, or the .bat
          # flashes open and dies (PowerShell -File on a missing script).
          $required = @('install.bat','uninstall.bat',
                        'tools\boot_wrapper.ps1','tools\install.ps1','tools\uninstall.ps1',
                        'texlib','templates')
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $stage $_)) }
          if ($missing) { Write-Host "FAIL: bundle missing: $($missing -join ', ')" -ForegroundColor Red; exit 1 }
          # And the .ps1 files must NOT be at the release root: the whole point
          # of tools\ is that a user opening the folder sees only the two .bat
          # files, with nothing beside them to mis-click.
          foreach ($r in 'install.ps1','uninstall.ps1') {
            if (Test-Path (Join-Path $stage $r)) {
              Write-Host "FAIL: $r is at the bundle root; it belongs in tools\" -ForegroundColor Red; exit 1
            }
          }
          # Build/dev-only tools must NOT ship. make-release.ps1 builds the
          # bundle; dev-install-test.ps1 drives install.ps1 against a seeded
          # sandbox and is useless (and confusing) to an end user.
          foreach ($t in 'make-release.ps1','dev-install-test.ps1') {
            if (Test-Path (Join-Path $stage "tools\$t")) {
              Write-Host "FAIL: $t should not be in the bundle" -ForegroundColor Red; exit 1
            }
          }

          # The wrapper install.bat invokes must be a real, parseable script
          # (a missing/corrupt wrapper is exactly what makes install.bat flash
          # open and die).
          $werr = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $stage 'tools\boot_wrapper.ps1'), [ref]$null, [ref]$werr)
          if ($werr) { Write-Host "FAIL: shipped boot_wrapper.ps1 has parse errors" -ForegroundColor Red; exit 1 }
          Write-Host "OK: release bundle contains every file install.bat needs." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 6. full-install — SLOW, GATED. Real -Silent install on a clean throwaway VM,
  #    then -Doctor, then uninstall.ps1 -Silent teardown. Never on push: only
  #    the weekly schedule OR a manual dispatch with full=true. TeX Live full
  #    scheme + 2 apps fits well under the 6h job cap.
  # ---------------------------------------------------------------------------
  full-install:
    if: >-
      github.event.schedule == '30 4 * * 1' ||
      (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      # Export INSTALL_ROOT FIRST so it is set even if a later step aborts — the
      # log-upload glob below depends on it. Pre-create it so the FIRST transcript
      # lands in <root>\Logs rather than %TEMP%\TeXLib-Install on a clean VM.
      - name: Export install root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'TeXLibRoot'
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          "INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Assemble stub texlib bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Minimal in-job stub. install.ps1 never parses/compiles the .sty during
          # install (the end verification compiles a self-contained hello.tex with
          # no \usepackage of the library), so stubs that merely EXIST satisfy
          # pre-flight 7i, section 13 deploy, and the Test-Path-guarded Sublime
          # deploy. Single-line Set-Content only — no here-strings (an indented
          # '@ / "@ terminator after YAML de-indentation is a parse error).
          New-Item -ItemType Directory -Force -Path 'texlib\Sublime' | Out-Null
          Set-Content -Encoding UTF8 -Path 'texlib\CHANGELOG.md' -Value "# Changelog`r`n`r`n## [Unreleased]`r`n- CI stub bundle (not a real release)."
          foreach ($p in 'course-metadata','texlib-build','basic-utilities') {
            $sty = "\NeedsTeXFormat{LaTeX2e}`r`n\ProvidesPackage{$p}[2026/01/01 CI stub]`r`n\endinput"
            Set-Content -Encoding UTF8 -Path ("texlib\{0}.sty" -f $p) -Value $sty
          }
          Set-Content -Encoding UTF8 -Path 'texlib\Sublime\texlib_builder.py' -Value '# CI stub builder.'
          Set-Content -Encoding UTF8 -Path 'texlib\Sublime\TeXLib.sublime-build' -Value '{ "//": "CI stub build." }'
          Set-Content -Encoding UTF8 -Path 'texlib\Sublime\Default.sublime-commands' -Value '[]'
          Set-Content -Encoding UTF8 -Path 'texlib\Sublime\LaTeX.sublime-settings' -Value '{ "//": "CI stub settings." }'

      - name: Real install (install.ps1 -Silent)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Run the installer exactly as a coworker does: powershell.exe (WinPS
          # 5.1), -Silent so no Read-Host / 'Press Enter' can hang. Null OneDrive
          # for the child so $NeedsUserRootJunction is deterministically false
          # (the load-time junction FATAL exit 12/13 is NOT gated by -Silent).
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''
          $env:OneDriveCommercial = ''
          $env:OneDriveConsumer = ''
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -InstallPath $env:INSTALL_ROOT
          $rc = $LASTEXITCODE
          Write-Host "install.ps1 -Silent exit code: $rc"
          exit $rc

      - name: Diagnose install (install.ps1 -Doctor)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Invoke-Doctor ALWAYS ends in Stop-Installer 0 regardless of how many
          # [FAIL] checks it printed, so its exit code has no teeth: capture
          # stdout and fail the step ourselves if Doctor reported any [FAIL].
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''
          $env:OneDriveCommercial = ''
          $env:OneDriveConsumer = ''
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Doctor -InstallPath $env:INSTALL_ROOT 2>&1 | Out-String
          Write-Host $out
          $rc = $LASTEXITCODE
          Write-Host "install.ps1 -Doctor exit code: $rc"
          if ($rc -ne 0) {
            Write-Host "Doctor exited non-zero ($rc)." -ForegroundColor Red
            exit $rc
          }
          if ($out -match '\[FAIL\]') {
            Write-Host "Doctor reported one or more [FAIL] checks; failing the job." -ForegroundColor Red
            exit 1
          }
          Write-Host "Doctor reported no [FAIL] checks." -ForegroundColor Green

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-log-${{ github.run_id }}
          # First-run transcript lands under <root>\Logs because we pre-created
          # the root; glob %TEMP%\TeXLib-Install too as a fallback (dash dir =
          # log dir; underscore dir = scratch, wiped). INSTALL_ROOT is always set.
          path: |
            ${{ env.INSTALL_ROOT }}\Logs\*.log
            ${{ runner.temp }}\TeXLib-Install\*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Teardown (uninstall.bat -Silent)
        # Always run so the VM is left clean even if install/Doctor failed.
        # uninstall.ps1 -Silent is fully non-interactive and always exits 0, so
        # it never masks an earlier failure (install/Doctor own pass/fail).
        # -InstallPath (new in 0.6.3) points it at the $RUNNER_TEMP root this job
        # installed to, so the teardown removes the real thing rather than
        # clearing HKCU/PATH/shortcuts and leaving the components behind.
        #
        # Routed through the .bat (not uninstall.ps1 directly) so the ONE job
        # that performs a real install also tears it down through the entry
        # point a user actually double-clicks, wrapper and all. The zero-arg
        # form of this path is covered by reuse-existing-library.
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $out = & cmd /c "uninstall.bat -Silent -InstallPath `"$env:INSTALL_ROOT`"" 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'positional parameter cannot be found') {
            Write-Host "FAIL: wrapper arg forwarding regressed." -ForegroundColor Red; exit 1
          }
          Write-Host "uninstall.ps1 -Silent exit code: $LASTEXITCODE"
          foreach ($gone in @('Sublime Text','Sumatra','Library','TexLive')) {
            if (Test-Path (Join-Path $env:INSTALL_ROOT $gone)) {
              Write-Host "FAIL: $gone survived the silent uninstall." -ForegroundColor Red; exit 1
            }
          }
          Write-Host "OK: silent uninstall removed every component." -ForegroundColor Green
