name: install-test

on:
  push:
  schedule:
    # Daily 06:13 UTC: hash-rot canary (verify-downloads only).
    - cron: '13 6 * * *'
    # Weekly Mon 04:30 UTC: real full-install end-to-end (full-install only).
    - cron: '30 4 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the slow real full-install + Doctor + uninstall job'
        type: boolean
        required: false
        default: false

# Keep the event type in the group key so a push, a workflow_dispatch, and a
# schedule run land in SEPARATE concurrency groups. Pushes and scheduled/
# dispatched runs share a ref (refs/heads/main), and a *starting* run with
# cancel-in-progress=true cancels other in-progress runs in its group -- so
# without the event_name split, merging a PR (a push to main) would cancel an
# in-flight full-install. cancel-in-progress stays push-only, so successive
# pushes supersede each other but never kill a long dispatched/scheduled run.
concurrency:
  group: install-test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. encoding-guard — FAST. Fails if install.ps1 / uninstall.ps1 ever regress
  #    to UTF-8 *without* a BOM while containing non-ASCII (em-dashes). That
  #    exact condition makes Windows PowerShell 5.1 (what the .bat entry points launch)
  #    decode the script as Windows-1252 and abort with a parse error before
  #    running a line — the bug that shipped in v0.5.0. This guard makes the
  #    regression impossible to merge unnoticed.
  # ---------------------------------------------------------------------------
  encoding-guard:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Assert install.ps1 / uninstall.ps1 are UTF-8 with BOM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          foreach ($f in 'tools\install.ps1','tools\uninstall.ps1') {
            $b = [System.IO.File]::ReadAllBytes((Resolve-Path $f))
            $hasBom = ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)
            $nonAscii = ($b | Where-Object { $_ -ge 0x80 }).Count
            Write-Host ("{0}: BOM={1} nonAscii={2}" -f $f, $hasBom, $nonAscii)
            if ((-not $hasBom) -and $nonAscii -gt 0) { $bad += $f }
          }
          if ($bad.Count) {
            Write-Host "FAIL: non-ASCII without a UTF-8 BOM -> WinPS 5.1 will not parse: $($bad -join ', ')" -ForegroundColor Red
            exit 1
          }
          Write-Host "Encoding guard passed." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 1b. wrapper-arg-forwarding — FAST. Regression for the v0.6.0 uninstaller
  #     crash: a no-arg launch (normal double-click) left $InnerArgs = $null, and
  #     `& $Inner @InnerArgs` splatted a lone $null as a POSITIONAL argument.
  #     uninstall.ps1 has only [switch]$Silent (no positional-capable param), so
  #     WinPS 5.1 aborted with "A positional parameter cannot be found that
  #     accepts argument '$null'" BEFORE uninstalling anything. install.ps1 only
  #     dodged it because its [string]$InstallPath positional absorbed the null.
  #     Drives the REAL boot_wrapper.ps1 against a stub inner script whose param
  #     block matches uninstall.ps1 (switch-only), reproducing the exact crash
  #     condition, and asserts it does not recur. The other jobs run install.ps1
  #     directly and never exercise the wrapper's splat, so this is the only
  #     guard for it.
  # ---------------------------------------------------------------------------
  wrapper-arg-forwarding:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: boot_wrapper.ps1 forwards zero inner args without a stray $null
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Assemble a sandbox mirroring the release layout (wrapper and inner
          # scripts together in tools\) so the REAL wrapper's $PSScriptRoot
          # resolution finds our stub as the sibling '<Kind>.ps1'.
          $sandbox = Join-Path $env:RUNNER_TEMP 'wrap-arg-test'
          Remove-Item -Recurse -Force $sandbox -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $sandbox 'tools') | Out-Null
          Copy-Item .\tools\boot_wrapper.ps1 (Join-Path $sandbox 'tools\boot_wrapper.ps1')
          # Stub inner script with uninstall.ps1's exact switch-only signature.
          $stub = @(
            '[CmdletBinding()]'
            'param([switch]$Silent)'
            'Write-Host "STUB-INNER-RAN Silent=$Silent"'
            'exit 0'
          ) -join "`r`n"
          Set-Content -Encoding UTF8 -Path (Join-Path $sandbox 'tools\uninstall.ps1') -Value $stub

          # Launch exactly as tools\uninstall-console.bat does: WinPS 5.1, -File, positional
          # 'uninstall', NO further args. `type nul |` feeds a closed, empty
          # stdin so the wrapper's final Read-Host returns at once instead of
          # hanging the headless job.
          $wrapper = Join-Path $sandbox 'tools\boot_wrapper.ps1'
          $out = & cmd /c "type nul | powershell.exe -NoProfile -ExecutionPolicy Bypass -File `"$wrapper`" uninstall" 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          Write-Host "wrapper exit code: $rc"

          if ($out -match 'positional parameter cannot be found') {
            Write-Host "FAIL: the stray-`$null splat regressed." -ForegroundColor Red; exit 1
          }
          if ($out -notmatch 'STUB-INNER-RAN') {
            Write-Host "FAIL: inner script never ran through the wrapper." -ForegroundColor Red; exit 1
          }
          if ($rc -ne 0) {
            Write-Host "FAIL: wrapper exited $rc (expected 0)." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: boot_wrapper forwards zero inner args cleanly." -ForegroundColor Green

      - name: boot_wrapper.ps1 forwards NAMED arguments to the right parameters
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Testing only the zero-arg case is precisely why the named-argument
          # bug shipped from v0.3.0 through v0.6.0. `& $script @array` splats
          # POSITIONALLY, so every documented `install-console.bat -Flag` form was
          # wrong: -Doctor landed in install.ps1's positional [string]
          # $InstallPath (starting a real install into a folder named
          # "-Doctor"), while uninstall.ps1 -- with no positional parameter to
          # absorb it -- aborted outright. This drives the REAL wrapper against
          # stubs shaped like the real scripts and checks where each token
          # actually lands.
          $sandbox = Join-Path $env:RUNNER_TEMP 'wrap-named-test'
          Remove-Item -Recurse -Force $sandbox -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $sandbox 'tools') | Out-Null
          Copy-Item .\tools\boot_wrapper.ps1 (Join-Path $sandbox 'tools\boot_wrapper.ps1')

          # install.ps1's shape: switches PLUS a positional string parameter.
          $inst = @(
            '[CmdletBinding()]'
            'param([switch]$Silent,[switch]$Doctor,[switch]$DryRun,[string]$InstallPath = "")'
            'Write-Host "BOUND Silent=$Silent Doctor=$Doctor DryRun=$DryRun InstallPath=[$InstallPath]"'
            'exit 0'
          ) -join "`r`n"
          Set-Content -Encoding UTF8 -Path (Join-Path $sandbox 'tools\install.ps1') -Value $inst
          # uninstall.ps1's shape: switch-only, nothing to absorb a stray token.
          $unin = @(
            '[CmdletBinding()]'
            'param([switch]$Silent,[switch]$RemoveJunction)'
            'Write-Host "BOUND Silent=$Silent RemoveJunction=$RemoveJunction"'
            'exit 0'
          ) -join "`r`n"
          Set-Content -Encoding UTF8 -Path (Join-Path $sandbox 'tools\uninstall.ps1') -Value $unin

          $wrapper = Join-Path $sandbox 'tools\boot_wrapper.ps1'
          $bad = 0
          function Drive($argline, $expect) {
            $out = & cmd /c "type nul | powershell.exe -NoProfile -ExecutionPolicy Bypass -File `"$wrapper`" $argline" 2>&1 | Out-String
            $line = ($out -split "`r?`n" | Where-Object { $_ -match '^BOUND ' } | Select-Object -First 1)
            $ok = ($line -eq $expect)
            if ($out -match 'positional parameter cannot be found') { $ok = $false }
            if (-not $ok) { $script:bad++ }
            "{0}  {1,-38} {2}" -f $(if($ok){'PASS'}else{'FAIL'}), $argline, $line
            if (-not $ok) { "        expected: $expect" }
          }

          Drive 'uninstall'                          'BOUND Silent=False RemoveJunction=False'
          Drive 'uninstall -Silent'                  'BOUND Silent=True RemoveJunction=False'
          Drive 'uninstall -RemoveJunction -Silent'  'BOUND Silent=True RemoveJunction=True'
          Drive 'install'                            'BOUND Silent=False Doctor=False DryRun=False InstallPath=[]'
          Drive 'install -Silent'                    'BOUND Silent=True Doctor=False DryRun=False InstallPath=[]'
          Drive 'install -Doctor'                    'BOUND Silent=False Doctor=True DryRun=False InstallPath=[]'
          Drive 'install -DryRun -Silent'            'BOUND Silent=True Doctor=False DryRun=True InstallPath=[]'
          Drive 'install -InstallPath C:\Tools\TL'   'BOUND Silent=False Doctor=False DryRun=False InstallPath=[C:\Tools\TL]'
          Drive 'install -Silent -InstallPath C:\Tools\TL' 'BOUND Silent=True Doctor=False DryRun=False InstallPath=[C:\Tools\TL]'
          Drive 'install C:\Tools\TL'                'BOUND Silent=False Doctor=False DryRun=False InstallPath=[C:\Tools\TL]'

          if ($bad) { Write-Host "$bad case(s) failed." -ForegroundColor Red; exit 1 }
          Write-Host "OK: named arguments reach their real parameters through the wrapper." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 1c. unit-helpers — FASTEST. Pure-logic coverage for install.ps1's decision
  #     helpers, with no VM install and no network.
  #
  #     install.ps1 is one long straight-line script, so historically the only
  #     way to test ANY decision it makes was to boot a runner and install. That
  #     is why the update-check comparison shipped broken: it told you to
  #     "update" from v0.6.1 to v0.6.0, and nothing asserted otherwise.
  #
  #     Rather than move the helper into a dot-sourced tools\ library — which
  #     install.ps1 would then DEPEND on at runtime, and a release bundle could
  #     omit (the 2026-06-15 flash-and-die) — this job lifts the function out of
  #     install.ps1 by AST and runs a case table against it. The shipped
  #     artifact stays a single self-contained script; the test still exercises
  #     the real source, and fails loudly if the function is renamed or inlined.
  # ---------------------------------------------------------------------------
  unit-helpers:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Test-IsNewerVersion case table (extracted from install.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                   (Resolve-Path .\tools\install.ps1), [ref]$null, [ref]$null)
          $fn = $ast.FindAll({
                  param($n)
                  $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $n.Name -eq 'Test-IsNewerVersion' }, $true)
          if ($fn.Count -ne 1) {
            Write-Host "FAIL: expected exactly 1 Test-IsNewerVersion definition in install.ps1, found $($fn.Count)." -ForegroundColor Red
            Write-Host "      If it was renamed or inlined, update this job -- do not delete it." -ForegroundColor Red
            exit 1
          }
          . ([scriptblock]::Create($fn[0].Extent.Text))

          # candidate, current, expected-"an update is available"
          $cases = @(
            @('0.6.0',      '0.6.1',  $false),   # the shipped bug: never offer a DOWNGRADE
            @('0.7.0',      '0.6.1',  $true ),
            @('0.6.1',      '0.6.1',  $false),
            @('0.6.10',     '0.6.9',  $true ),   # string compare orders these backwards
            @('0.6.9',      '0.6.10', $false),
            @('1.0',        '0.9.9',  $true ),   # ragged component counts
            @('1.0.0-beta', '0.6.1',  $true ),   # unparseable -> string inequality
            @('',           '0.6.1',  $false),   # empty/absent tag -> never nag
            @($null,        '0.6.1',  $false)
          )
          $bad = 0
          foreach ($c in $cases) {
            $got = Test-IsNewerVersion -Candidate $c[0] -Current $c[1]
            $ok  = ($got -eq $c[2])
            if (-not $ok) { $bad++ }
            "{0}  candidate='{1}' current='{2}' -> {3} (expected {4})" -f `
              $(if ($ok) {'PASS'} else {'FAIL'}), $c[0], $c[1], $got, $c[2]
          }
          if ($bad) { Write-Host "$bad case(s) failed." -ForegroundColor Red; exit 1 }
          Write-Host "OK: all $($cases.Count) version-comparison cases passed." -ForegroundColor Green

      - name: Read-SkipOrReinstall / -Reinstall case table (extracted from install.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # -Reinstall is a comma-separated STRING, not a [string[]] with a
          # ValidateSet, because `powershell.exe -File install.ps1 -Reinstall
          # Sublime,TeXLive` -- exactly how install-gui.ps1 invokes it -- does
          # no array parsing and hands the whole value over as one token. A
          # [string[]] parameter then fails validation. That regressed once
          # already; this table is what keeps it from regressing again.
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                   (Resolve-Path .\tools\install.ps1), [ref]$null, [ref]$null)
          foreach ($n in 'Get-ReinstallList','Test-ReinstallRequested','Read-SkipOrReinstall') {
            $fn = $ast.FindAll({
                    param($x)
                    $x -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                    $x.Name -eq $n }, $true)
            if ($fn.Count -ne 1) {
              Write-Host "FAIL: expected exactly 1 $n in install.ps1, found $($fn.Count)." -ForegroundColor Red; exit 1
            }
            . ([scriptblock]::Create($fn[0].Extent.Text))
          }
          $bad = 0
          # The parameter must still be a plain [string]; a [string[]] here is
          # the regression, and it is invisible until someone runs the GUI.
          $param = $ast.ParamBlock.Parameters | Where-Object { $_.Name.VariablePath.UserPath -eq 'Reinstall' }
          if (-not $param) { Write-Host "FAIL: install.ps1 has no -Reinstall parameter." -ForegroundColor Red; exit 1 }
          if ($param.StaticType.Name -ne 'String') {
            Write-Host "FAIL: -Reinstall is [$($param.StaticType.Name)]; it must be [string] so -File invocation works." -ForegroundColor Red; $bad++
          }
          foreach ($c in @(
            @{ Raw = 'Sublime,TeXLive'; Err = $false; List = @('Sublime','TeXLive') },
            @{ Raw = 'sublime, texlive'; Err = $false; List = @('Sublime','TeXLive') },
            @{ Raw = 'Sublime;SumatraPDF'; Err = $false; List = @('Sublime','SumatraPDF') },
            @{ Raw = 'All'; Err = $false; List = @('All') },
            @{ Raw = 'Emacs'; Err = $true;  List = @() }
          )) {
            $p = Get-ReinstallList $c.Raw
            if ($c.Err) {
              if (-not $p.Error) { Write-Host "FAIL: '$($c.Raw)' should be rejected." -ForegroundColor Red; $bad++ }
              else { "PASS  '$($c.Raw)' rejected on '$($p.Error)'" }
            } else {
              if (($p.List -join ',') -ne ($c.List -join ',')) {
                Write-Host "FAIL: '$($c.Raw)' -> '$($p.List -join ',')', expected '$($c.List -join ',')'" -ForegroundColor Red; $bad++
              } else { "PASS  '$($c.Raw)' -> $($p.List -join '|')" }
            }
          }
          # -Silent alone must still skip EVERYTHING; that default is what the
          # unattended and lab-deployment paths rely on.
          $Silent = $true
          foreach ($c in @(
            @{ R = @();                     C = 'Sublime Text'; Want = $false },
            @{ R = @('Sublime');            C = 'Sublime Text'; Want = $true  },
            @{ R = @('Sublime');            C = 'TeX Live';     Want = $false },
            @{ R = @('Sublime','TeXLive');  C = 'TeX Live';     Want = $true  },
            @{ R = @('All');                C = 'SumatraPDF';   Want = $true  }
          )) {
            $ReinstallList = $c.R
            $got = Read-SkipOrReinstall -ComponentName $c.C 6>$null
            if ($got -ne $c.Want) {
              Write-Host "FAIL: -Reinstall [$($c.R -join ',')] vs '$($c.C)' -> $got, expected $($c.Want)" -ForegroundColor Red; $bad++
            } else { "PASS  -Reinstall [$($c.R -join ',')] vs '$($c.C)' -> $got" }
          }
          if ($bad) { Write-Host "$bad case(s) failed." -ForegroundColor Red; exit 1 }
          Write-Host "OK: -Reinstall parsing and skip/reinstall decisions all correct." -ForegroundColor Green

      - name: Get-MissingTexPackage case table (extracted from install.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The interesting input is the one a healthy machine never produces.
          # kpsewhich prints a path per file it finds and an EMPTY LINE per file
          # it does not -- and that empty line is what broke the original check:
          # Split-Path "" throws, the script-wide "Stop" made it terminating, and
          # every package got reported missing on a perfectly good install. A
          # full TeX Live resolves everything, so full-install could never have
          # caught it. Hence a case table rather than an end-to-end assertion.
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                   (Resolve-Path .\tools\install.ps1), [ref]$null, [ref]$null)
          $fn = $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                               $args[0].Name -eq 'Get-MissingTexPackage' }, $true)
          if ($fn.Count -ne 1) {
            Write-Host "FAIL: expected exactly 1 Get-MissingTexPackage in install.ps1, found $($fn.Count)." -ForegroundColor Red; exit 1
          }
          . ([scriptblock]::Create($fn[0].Extent.Text))

          $bad = 0
          function Check($label, $got, $expected) {
            $g = @($got) -join ','
            $e = @($expected) -join ','
            $ok = ($g -eq $e)
            if (-not $ok) { $script:bad++ }
            "{0}  {1}`n      got=[{2}] expected=[{3}]" -f $(if($ok){'PASS'}else{'FAIL'}), $label, $g, $e
          }

          $wanted = @('amsmath.sty','tabularray.sty','tikz.sty')

          # The real shape: a hit, a blank for the miss, a hit.
          Check 'blank line marks a missing package' `
            (Get-MissingTexPackage -KpsewhichOutput @(
                'c:/tl/texmf-dist/tex/latex/amsmath/amsmath.sty', '', 'c:/tl/texmf-dist/tex/latex/pgf/tikz.sty') -Wanted $wanted) `
            @('tabularray')

          Check 'everything found' `
            (Get-MissingTexPackage -KpsewhichOutput @(
                'c:/tl/amsmath.sty','c:/tl/tabularray.sty','c:/tl/tikz.sty') -Wanted $wanted) `
            @()

          Check 'nothing found (all blanks)' `
            (Get-MissingTexPackage -KpsewhichOutput @('','','') -Wanted $wanted) `
            @('amsmath','tabularray','tikz')

          Check 'no output at all' `
            (Get-MissingTexPackage -KpsewhichOutput @() -Wanted $wanted) `
            @('amsmath','tabularray','tikz')

          Check 'backslash separators also parse' `
            (Get-MissingTexPackage -KpsewhichOutput @('c:\tl\amsmath.sty') -Wanted @('amsmath.sty')) `
            @()

          Check 'whitespace-only line counts as missing' `
            (Get-MissingTexPackage -KpsewhichOutput @('   ') -Wanted @('amsmath.sty')) `
            @('amsmath')

          if ($bad) { Write-Host "$bad case(s) failed." -ForegroundColor Red; exit 1 }
          Write-Host "OK: package-resolution parsing handles the missing-file marker." -ForegroundColor Green

      - name: Every in-script call passes parameters the function actually has
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The case table above passes while the SHIPPED code is broken if a
          # call site misspells a parameter: these are simple functions (no
          # CmdletBinding), and PowerShell sweeps unrecognised arguments into
          # $args instead of erroring. That is exactly how v0.7.0 shipped an
          # -Update that always reported "already on the latest release" --
          # `Test-IsNewerVersion -Latest $x` left -Candidate unbound and $null,
          # and the null guard returned $false. It failed SAFE, so nothing
          # complained. Walk the AST and check every call against the real
          # parameter names of the function it targets.
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                   (Resolve-Path .\tools\install.ps1), [ref]$null, [ref]$null)

          $funcs = @{}
          foreach ($f in $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)) {
            $names = @()
            if ($f.Parameters) { $names = @($f.Parameters | ForEach-Object { $_.Name.VariablePath.UserPath }) }
            elseif ($f.Body.ParamBlock) { $names = @($f.Body.ParamBlock.Parameters | ForEach-Object { $_.Name.VariablePath.UserPath }) }
            $funcs[$f.Name] = $names
          }

          $bad = 0
          foreach ($cmd in $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.CommandAst] }, $true)) {
            $name = $cmd.GetCommandName()
            if (-not $name -or -not $funcs.ContainsKey($name)) { continue }
            foreach ($el in $cmd.CommandElements) {
              if ($el -isnot [System.Management.Automation.Language.CommandParameterAst]) { continue }
              $p = $el.ParameterName
              # Accept an unambiguous prefix, exactly as PowerShell binds.
              $match = @($funcs[$name] | Where-Object { $_ -ieq $p })
              if ($match.Count -eq 0) { $match = @($funcs[$name] | Where-Object { $_ -ilike "$p*" }) }
              if ($match.Count -ne 1) {
                Write-Host ("FAIL: line {0}: {1} -{2} -- no such parameter (has: {3})" -f `
                  $el.Extent.StartLineNumber, $name, $p, ($funcs[$name] -join ', ')) -ForegroundColor Red
                $bad++
              }
            }
          }
          if ($bad) {
            Write-Host "$bad bad call site(s). A simple function swallows these silently." -ForegroundColor Red
            exit 1
          }
          Write-Host "OK: every call to a locally-defined function binds real parameters." -ForegroundColor Green

      - name: Test-InstallerOwnsJunction case table (extracted from uninstall.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Same AST-extraction trick, and here it is not just convenient: the
          # alternative is creating a real junction at %USERPROFILE%\TeXLib,
          # which on a developer machine is the live link to their library.
          # Testing the decision in isolation keeps that path untouched.
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                   (Resolve-Path .\tools\uninstall.ps1), [ref]$null, [ref]$null)
          $fn = $ast.FindAll({
                  param($n)
                  $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $n.Name -eq 'Test-InstallerOwnsJunction' }, $true)
          if ($fn.Count -ne 1) {
            Write-Host "FAIL: expected exactly 1 Test-InstallerOwnsJunction in uninstall.ps1, found $($fn.Count)." -ForegroundColor Red
            exit 1
          }
          . ([scriptblock]::Create($fn[0].Extent.Text))

          $t = Join-Path $env:RUNNER_TEMP 'junction-cases'
          New-Item -ItemType Directory -Force -Path $t | Out-Null
          $J = 'C:\Users\bob\TeXLib'
          function New-VersionFile($name, $content) {
            $f = Join-Path $t $name
            Set-Content -Path $f -Value $content -Encoding UTF8
            return $f
          }

          # description, VERSION file, expected "installer owns this junction"
          $cases = @(
            @('claims the junction',   (New-VersionFile 'claim.txt' "installer_version=0.6.1`ntexlib_root=C:\Users\bob\TeXLib"), $true ),
            @('trailing backslash',    (New-VersionFile 'slash.txt' "texlib_root=C:\Users\bob\TeXLib\"),                          $true ),
            @('different case',        (New-VersionFile 'case.txt'  "texlib_root=c:\users\bob\texlib"),                           $true ),
            @('surrounding whitespace',(New-VersionFile 'ws.txt'    "texlib_root =  C:\Users\bob\TeXLib  "),                      $true ),
            @('claims another path',   (New-VersionFile 'other.txt' "texlib_root=C:\Users\bob\OneDrive - X, Y\Documents\TeXLib"), $false),
            @('no texlib_root key',    (New-VersionFile 'nokey.txt' "installer_version=0.6.1"),                                   $false),
            @('empty texlib_root',     (New-VersionFile 'empty.txt' "texlib_root="),                                             $false),
            @('VERSION missing',       (Join-Path $t 'nope.txt'),                                                                 $false),
            @('null VersionFile',      $null,                                                                                     $false)
          )
          $bad = 0
          foreach ($c in $cases) {
            $got = Test-InstallerOwnsJunction -JunctionPath $J -VersionFile $c[1]
            $ok  = ($got -eq $c[2])
            if (-not $ok) { $bad++ }
            "{0}  {1,-24} -> {2} (expected {3})" -f $(if ($ok) {'PASS'} else {'FAIL'}), $c[0], $got, $c[2]
          }
          $got = Test-InstallerOwnsJunction -JunctionPath '' -VersionFile $cases[0][1]
          if ($got -ne $false) { Write-Host "FAIL: empty JunctionPath returned $got" -ForegroundColor Red; $bad++ }

          if ($bad) { Write-Host "$bad case(s) failed." -ForegroundColor Red; exit 1 }
          Write-Host "OK: junction-ownership decision holds." -ForegroundColor Green

      - name: ConvertTo-InnerArgumentBinding case table (extracted from boot_wrapper.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                   (Resolve-Path .\tools\boot_wrapper.ps1), [ref]$null, [ref]$null)
          $fn = $ast.FindAll({
                  param($n)
                  $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $n.Name -eq 'ConvertTo-InnerArgumentBinding' }, $true)
          if ($fn.Count -ne 1) {
            Write-Host "FAIL: expected exactly 1 ConvertTo-InnerArgumentBinding, found $($fn.Count)." -ForegroundColor Red
            exit 1
          }
          . ([scriptblock]::Create($fn[0].Extent.Text))

          # Mirrors install.ps1's real parameter shape: switches plus two
          # value-taking parameters, one of which ($InstallPath) is positional
          # and therefore silently absorbed stray tokens before the fix.
          $IsSwitch = @{
            Silent = $true; Doctor = $true; Version = $true; DryRun = $true
            OnlyTeXLib = $true; Sandbox = $true; HideJunction = $true; VerifyDownloads = $true
            InstallPath = $false; TeXLibPath = $false
          }
          $bad = 0
          function Check($desc, $tokens, $expectNamed, $expectPositional) {
            $b = ConvertTo-InnerArgumentBinding -Tokens $tokens -IsSwitch $IsSwitch
            $gotN = ($b.Named.GetEnumerator() | Sort-Object Key | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ','
            $gotP = (@($b.Positional)) -join ','
            $ok = ($gotN -eq $expectNamed) -and ($gotP -eq $expectPositional)
            if (-not $ok) { $script:bad++ }
            "{0}  {1,-34} named[{2}] pos[{3}]" -f $(if($ok){'PASS'}else{'FAIL'}), $desc, $gotN, $gotP
            if (-not $ok) { "        expected named[$expectNamed] pos[$expectPositional]" }
          }

          Check 'no tokens'                 @()                                ''                             ''
          Check 'null tokens'               $null                              ''                             ''
          Check 'single switch'             @('-Silent')                       'Silent=True'                  ''
          Check 'two switches'              @('-DryRun','-Silent')             'DryRun=True,Silent=True'      ''
          Check 'value param'               @('-InstallPath','C:\T')           'InstallPath=C:\T'             ''
          Check 'switch + value param'      @('-Silent','-InstallPath','C:\T') 'InstallPath=C:\T,Silent=True' ''
          Check 'bare positional'           @('C:\T')                          ''                             'C:\T'
          Check 'lowercase name'            @('-silent')                       'Silent=True'                  ''
          Check 'UPPERCASE name'            @('-SILENT')                       'Silent=True'                  ''
          Check 'unique prefix'             @('-Sandb')                        'Sandbox=True'                 ''
          Check 'colon form, value'         @('-InstallPath:C:\T')             'InstallPath=C:\T'             ''
          Check 'colon form, switch $false' @('-Silent:$false')                'Silent=False'                 ''
          Check 'colon form, switch true'   @('-Silent:true')                  'Silent=True'                  ''
          Check 'unknown flag stays named'  @('-Bogus')                        'Bogus=True'                   ''
          Check 'value param at end'        @('-InstallPath')                  'InstallPath=True'             ''
          Check 'value param before flag'   @('-InstallPath','-Silent')        'InstallPath=True,Silent=True' ''
          Check 'positional then switch'    @('C:\T','-Silent')                'Silent=True'                  'C:\T'
          Check 'lone dash is positional'   @('-')                             ''                             '-'
          # -V is ambiguous (Version / VerifyDownloads): forward as-is and let
          # the inner script reject it rather than silently picking one.
          Check 'ambiguous prefix forwarded' @('-V')                           'V=True'                       ''

          if ($bad) { Write-Host "$bad case(s) failed." -ForegroundColor Red; exit 1 }
          Write-Host "OK: argument binding holds across 19 forms." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 2. verify-downloads — FAST hash-rot canary. Runs install.ps1 -VerifyDownloads
  #    (early-exit: downloads each pinned component, checks its SHA256/512, exits
  #    0 all-good / 20 drift) on a clean VM. Catches a vendor silently
  #    repackaging a pinned artifact before it breaks a coworker. Needs NO texlib
  #    bundle: -VerifyDownloads dispatches before pre-flight 7i.
  #    Runs on push, manual dispatch, and the daily 06:13 cron — not the weekly.
  # ---------------------------------------------------------------------------
  verify-downloads:
    if: github.event_name != 'schedule' || github.event.schedule == '13 6 * * *'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Guard — the -VerifyDownloads switch exists
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Fail fast (and legibly) if the switch was removed, rather than let
          # WinPS 5.1's CmdletBinding param-binding error surface as an opaque
          # exit 1 that looks just like a real hash drift.
          if (-not (Select-String -Path .\tools\install.ps1 -Pattern 'VerifyDownloads' -Quiet)) {
            Write-Host "install.ps1 has no -VerifyDownloads switch; the canary cannot run." -ForegroundColor Red
            exit 1
          }

      - name: install.ps1 -VerifyDownloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # -Silent as defense-in-depth: if this mode ever fell through to
          # install logic it still could not block on a Read-Host. WRAPPED=1
          # suppresses the wrapper-style final pause belt-and-suspenders.
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -VerifyDownloads
          $rc = $LASTEXITCODE
          Write-Host "install.ps1 -VerifyDownloads exit code: $rc  (0=all good, 20=drift)"
          exit $rc

  # ---------------------------------------------------------------------------
  # 3. dry-run — FAST sanity check. Pre-flight + plan only, no disk changes.
  #    A stub texlib/ is staged to exercise the local-tree override path
  #    passes; junction logic is observe-only in -DryRun and OneDrive is nulled
  #    so the junction branch is deterministically unreachable.
  #    NOTE: -DryRun runs the FULL pre-flight, including the fatal HEAD check to
  #    https://mirror.ctan.org/ (install.ps1). A transient CTAN mirror outage can
  #    red this job; a dry-run log showing ONLY that HEAD failure is infra flake,
  #    not an installer-logic defect.
  # ---------------------------------------------------------------------------
  dry-run:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Assert a bundle-less checkout plans a download (0.11.0)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''; $env:OneDriveCommercial = ''; $env:OneDriveConsumer = ''
          # No texlib\ staged. Through 0.10.x this was a hard pre-flight failure
          # with three different ways of saying "you downloaded the wrong zip",
          # because a bundled snapshot was the ONLY source of the library. 0.11.0
          # downloads it like every other component, so a bare source checkout is
          # a perfectly good install -- pre-flight must say so, not refuse.
          $installRoot = Join-Path $env:RUNNER_TEMP 'TeXLibNoBundle'
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -DryRun -InstallPath $installRoot 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) {
            Write-Host "FAIL: a bundle-less checkout should plan a download, not fail pre-flight (exit $rc)" -ForegroundColor Red; exit 1
          }
          if ($out -notmatch 'will be downloaded from GitHub') {
            Write-Host "FAIL: pre-flight did not announce the library download" -ForegroundColor Red; exit 1
          }
          if ($out -match 'GitHub SOURCE download') {
            Write-Host "FAIL: the old wrong-zip guidance is still being emitted" -ForegroundColor Red; exit 1
          }
          Write-Host "OK: a source checkout installs like a release; the library is fetched." -ForegroundColor Green

      - name: Stage stub texlib bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A sibling texlib\ dir overrides the pinned download (0.11.0), which
          # keeps this job offline. Nothing parses the
          # .sty contents at install time, so a minimal stub suffices. Single-
          # line Set-Content avoids any here-string terminator pitfalls.
          New-Item -ItemType Directory -Force -Path 'texlib\Sublime' | Out-Null
          # 'Unreleased' top entry makes Show-VersionInfo skip the banner.
          Set-Content -Encoding UTF8 -Path 'texlib\CHANGELOG.md' -Value "# Changelog`r`n`r`n## [Unreleased]`r`n- CI stub bundle (not a real release)."

      - name: install.ps1 -DryRun
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          # Null OneDrive for the child so $NeedsUserRootJunction is
          # deterministically false regardless of runner provisioning.
          $env:OneDrive = ''
          $env:OneDriveCommercial = ''
          $env:OneDriveConsumer = ''
          $installRoot = Join-Path $env:RUNNER_TEMP 'TeXLibRoot'
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -DryRun -InstallPath $installRoot
          $rc = $LASTEXITCODE
          Write-Host "install.ps1 -DryRun exit code: $rc"
          if ($rc -ne 0) {
            Write-Host "Expected exit 0 from -DryRun, got $rc" -ForegroundColor Red
          }
          exit $rc

  # ---------------------------------------------------------------------------
  # 4. junction — FAST. Exercises the comma/space library path that the v0.5.0
  #    user-root junction feature exists for. Since 0.6.3 the library lives at
  #    <InstallPath>\Library, so the way to reach that path is an -InstallPath
  #    with a space and a comma in it (before 0.6.3 it was a UNR-style OneDrive
  #    folder name, which no runner has). Runs -OnlyTeXLib (junction + bundle
  #    deploy, NOT the ~30 min TeX Live install), then asserts
  #    %USERPROFILE%\TeXLib is a junction pointing at the library.
  # ---------------------------------------------------------------------------
  junction:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Stage stub texlib bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'texlib\Sublime' | Out-Null
          Set-Content -Encoding UTF8 -Path 'texlib\CHANGELOG.md' -Value "# Changelog`r`n`r`n## [Unreleased]`r`n- CI stub bundle (not a real release)."

      - name: Install to a path with BOTH a space and a comma in it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          # An install root whose path has BOTH a space and a comma, so the
          # library at <root>\Library trips $NeedsUserRootJunction -- kpathsea
          # splits TEXINPUTS on commas and chokes on spaces, and this is the
          # only way to reach that on a runner.
          $dirtyRoot = Join-Path $env:RUNNER_TEMP 'TeXLib Root, Fake Org'
          "DIRTY_ROOT=$dirtyRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:OneDrive = ''
          $env:OneDriveCommercial = ''
          $env:OneDriveConsumer = ''
          # -OnlyTeXLib exercises junction creation + bundle deploy WITHOUT the
          # ~30 min TeX Live full install.
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -OnlyTeXLib -InstallPath $dirtyRoot
          $rc = $LASTEXITCODE
          Write-Host "install.ps1 -Silent -OnlyTeXLib exit code: $rc"
          if ($rc -ne 0) { exit $rc }

      - name: Assert the user-root junction was created correctly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $junction = Join-Path $env:USERPROFILE 'TeXLib'
          if (-not (Test-Path $junction)) {
            Write-Host "FAIL: $junction was not created" -ForegroundColor Red; exit 1
          }
          $item = Get-Item $junction -Force
          if ($item.Attributes -notmatch 'ReparsePoint') {
            Write-Host "FAIL: $junction exists but is not a reparse point (junction)" -ForegroundColor Red; exit 1
          }
          $target = $item.Target; if (-not $target) { $target = $item.LinkTarget }
          $target = ($target -join ';')
          Write-Host "junction target: $target"
          if ($target -and ($target -notlike '*TeXLib Root, Fake Org*')) {
            Write-Host "FAIL: junction points somewhere unexpected" -ForegroundColor Red; exit 1
          }
          # 0.6.3 puts the library under the install root, so the junction has to
          # land on <root>\Library rather than the root itself.
          if ($target -and ($target -notlike '*\Library')) {
            Write-Host "FAIL: junction does not point at the <root>\Library folder" -ForegroundColor Red; exit 1
          }
          # The stub bundle deploys into $TeXLibDir, which was reassigned to the
          # junction -- so it must be visible through it.
          if (-not (Test-Path (Join-Path $junction 'CHANGELOG.md'))) {
            Write-Host "FAIL: stub bundle not visible through the junction" -ForegroundColor Red; exit 1
          }
          Write-Host "OK: %USERPROFILE%\TeXLib is a junction at the comma/space library path; bundle deployed through it." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 4b. reuse-existing-library — FAST. Covers the RETURNING machine, which every
  #     other job misses: they all stage a texlib\ bundle and install once onto a
  #     clean VM, so $UseExistingTeXLib is never true and the Skip/Reinstall
  #     prompts are never reached. Both v0.6.1 install bugs lived in exactly that
  #     gap:
  #
  #       * section 16 deployed the Sublime builder files from $TeXLibDir\Sublime
  #         into $SublimeUserSync -- the SAME directory once Packages\User is
  #         junctioned to it -- so Copy-Item threw "Cannot overwrite the item ...
  #         with itself" and killed the install at exit 10, with every file
  #         already correctly in place.
  #       * the interactive [S]kip/[R]einstall path is dead code under -Silent.
  #
  #     Seeding the install root with empty component dirs makes the installer
  #     skip all four big downloads (TeX Live, Sublime, Sumatra, LaTeXTools), so
  #     this runs a REAL full (non--OnlyTeXLib) install in about a minute. The
  #     end-of-install pdflatex verification only WARNs when the stub bin dir has
  #     no pdflatex.exe, so a stubbed toolchain still exits 0.
  # ---------------------------------------------------------------------------
  reuse-existing-library:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Seed a returning machine (existing library + installed components)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # NOTE: deliberately NO texlib\ bundle here. Bundle absent + library
          # already present is what sets $UseExistingTeXLib.
          $installRoot = Join-Path $env:RUNNER_TEMP 'TeXLibRoot'
          "INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # 0.6.3+ default: the library lives at <InstallPath>\Library. Seeding
          # it THERE is what makes the installer take the reuse-in-place path
          # ($UseExistingTeXLib) rather than the pre-0.6.3 migration path, which
          # legacy-library-migration covers separately. Pre-flight accepts the
          # library once the three core .sty files exist.
          $lib = Join-Path $installRoot 'Library'
          "LIB_ROOT=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path (Join-Path $lib 'Sublime') | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'CHANGELOG.md') -Value "# Changelog`r`n`r`n## [Unreleased]`r`n- CI stub library (not a real release)."
          foreach ($p in 'course-metadata','texlib-build','basic-utilities') {
            $sty = "\NeedsTeXFormat{LaTeX2e}`r`n\ProvidesPackage{$p}[2026/01/01 CI stub]`r`n\endinput"
            Set-Content -Encoding UTF8 -Path (Join-Path $lib "$p.sty") -Value $sty
          }
          # The builder files section 16 deploys. Their presence HERE is what
          # makes source and destination the same path once Packages\User is
          # junctioned to $lib\Sublime.
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'Sublime\texlib_builder.py') -Value '# CI stub builder.'
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'Sublime\TeXLib.sublime-build') -Value '{ "//": "CI stub build." }'
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'Sublime\Default.sublime-commands') -Value '[]'
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'Sublime\LaTeX.sublime-settings') -Value '{ "//": "CI stub settings." }'
          # The native Sublime package. Sublime only loads .py at the TOP level
          # of a package dir, so this must become its own Packages\TeXLib entry;
          # sitting at Packages\User\texlib\ (which the settings junction makes
          # true for free) loads nothing, which is what 0.6.4 and earlier did.
          New-Item -ItemType Directory -Force -Path (Join-Path $lib 'Sublime\texlib') | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'Sublime\texlib\texlib.py') -Value '# CI stub plugin.'

          # Empty component dirs are all the installer's Test-Path detection
          # needs to offer Skip -- no multi-GB downloads. TexLive\2025\bin\
          # windows must exist by that exact name ($TexLiveYear).
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $installRoot 'Sublime Text\Data\Packages\LaTeXTools'), `
            (Join-Path $installRoot 'Sublime Text\Data\Lib\python38\regex'), `
            (Join-Path $installRoot 'Sumatra'), `
            (Join-Path $installRoot 'TexLive\2025\bin\windows') | Out-Null
          # Skips the regex wheel download (section 16a-2 is gated on this file).
          Set-Content -Encoding UTF8 -Path (Join-Path $installRoot 'Sublime Text\Data\Lib\python38\regex\__init__.py') -Value '# CI stub regex.'

      - name: Full install onto the seeded machine (-Silent)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''; $env:OneDriveCommercial = ''; $env:OneDriveConsumer = ''
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -InstallPath $env:INSTALL_ROOT 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          Write-Host "install.ps1 exit code: $rc"

          # Assert on the message as well as the code: a future refactor could
          # swallow the self-copy into a warning and still "pass" on exit 0.
          if ($out -match 'with itself') {
            Write-Host "FAIL: section 16 tried to copy the builder files onto themselves." -ForegroundColor Red; exit 1
          }
          # The seed has to land us on the returning-machine branch, or this job
          # is not testing what it claims. Through 0.10.x that branch REUSED the
          # library in place (there was no bundle here, so nothing to deploy);
          # since 0.11.0 the pinned library is downloaded and deployed over it,
          # and only the Sublime settings alongside it are preserved. Either way
          # the hazard under test is the same: Packages\User is a junction to
          # the library's Sublime\ folder, so section 16 must not try to copy
          # those files onto themselves.
          if ($out -notmatch 'the download refreshes it') {
            Write-Host "FAIL: seed did not put the installer on the returning-machine path; this job is no longer testing what it claims." -ForegroundColor Red; exit 1
          }
          if ($rc -ne 0) { Write-Host "FAIL: install exited $rc on a returning machine." -ForegroundColor Red; exit $rc }
          Write-Host "OK: full install succeeded reusing an already-synced library." -ForegroundColor Green

      - name: Assert the builder files survived and Packages\User is junctioned
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lib  = $env:LIB_ROOT
          $user = Join-Path $env:INSTALL_ROOT 'Sublime Text\Data\Packages\User'
          if (-not (Test-Path $user)) { Write-Host "FAIL: $user missing" -ForegroundColor Red; exit 1 }
          $item = Get-Item $user -Force
          if ($item.Attributes -notmatch 'ReparsePoint') {
            Write-Host "FAIL: Packages\User is not a junction" -ForegroundColor Red; exit 1
          }
          # Skipping the copy must not mean skipping the outcome: the builder has
          # to be reachable through the junction.
          if (-not (Test-Path (Join-Path $user 'texlib_builder.py'))) {
            Write-Host "FAIL: texlib_builder.py not visible through Packages\User" -ForegroundColor Red; exit 1
          }
          # The seeded stub MUST have been replaced. This assertion used to run
          # the other way round: with no bundle to deploy, a returning machine
          # reused its library in place and the stub survived. Since 0.11.0 the
          # pinned library is downloaded and deployed over it, and refreshing
          # the library is the entire point -- a returning machine left holding
          # a stale builder would be the bug, not the contract.
          if ((Get-Content (Join-Path $lib 'Sublime\texlib_builder.py') -Raw) -match 'CI stub builder') {
            Write-Host "FAIL: the seeded stub builder survived; the pinned library was not deployed over it." -ForegroundColor Red; exit 1
          }
          # The native package needs its own Packages\TeXLib entry to load at all.
          $plugin = Join-Path $env:INSTALL_ROOT 'Sublime Text\Data\Packages\TeXLib'
          if (-not (Test-Path (Join-Path $plugin 'texlib.py'))) {
            Write-Host "FAIL: the TeXLib Sublime package was not deployed to $plugin" -ForegroundColor Red; exit 1
          }
          if ((Get-Item $plugin -Force).Attributes -notmatch 'ReparsePoint') {
            Write-Host "FAIL: Packages\TeXLib is not a junction, so it will not track library updates" -ForegroundColor Red; exit 1
          }
          Write-Host "OK: builder reachable through the junction; plugin deployed; library refreshed." -ForegroundColor Green

      - name: Re-run interactively, answering the Skip prompts on stdin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Everything is installed now, so a NON-silent re-run hits all three
          # [S]kip or [R]einstall prompts -- the path a coworker actually walks
          # and the one -Silent can never reach.
          #
          # Answers come from a FILE redirect, not `(echo s&echo s&echo s) |`:
          # cmd's `echo s&` emits a trailing space, so Read-Host would return
          # "s " -- harmless for Skip (anything but R/r skips) but silently
          # wrong the day someone extends this to test the "r" reinstall answer.
          # Redirected stdin is also closed at EOF, so the job cannot hang.
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''; $env:OneDriveCommercial = ''; $env:OneDriveConsumer = ''
          Set-Content -Encoding ascii -Path answers.txt -Value "s`r`ns`r`ns"
          $cmd = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\install.ps1 -InstallPath `"$env:INSTALL_ROOT`" < answers.txt"
          $out = & cmd /c $cmd 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          Write-Host "interactive re-run exit code: $rc"

          if ($out -match 'with itself') {
            Write-Host "FAIL: self-copy regressed on the interactive path." -ForegroundColor Red; exit 1
          }
          # Assert on the Write-Host lines around the prompt, NOT on the prompt
          # text itself: with stdin redirected, Read-Host's prompt goes to the
          # console but never reaches the captured stdout (it shows up only in
          # the Start-Transcript log), so matching it would fail spuriously.
          $seen = ([regex]::Matches($out, 'is already installed\.')).Count
          if ($seen -lt 3) {
            Write-Host "FAIL: expected 3 already-installed prompts (Sublime, Sumatra, TeX Live), saw $seen." -ForegroundColor Red; exit 1
          }
          foreach ($c in 'Skipping Sublime Text','Skipping SumatraPDF','Skipping TeX Live') {
            if ($out -notmatch [regex]::Escape($c)) {
              Write-Host "FAIL: '$c' not reached -- the stdin answer did not take." -ForegroundColor Red; exit 1
            }
          }
          if ($rc -ne 0) { Write-Host "FAIL: interactive re-run exited $rc." -ForegroundColor Red; exit $rc }
          Write-Host "OK: interactive re-run skipped all three components and completed." -ForegroundColor Green

      - name: Teardown through tools\uninstall-console.bat (zero args, wrapper path)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Deliberately the .bat with NO arguments -- the double-click path, and
          # the exact shape that crashed v0.6.1 ($InnerArgs = $null splatted as a
          # positional into uninstall.ps1's switch-only param block). The other
          # jobs invoke uninstall.ps1 directly and cannot catch this.
          #
          # 'Y' answers the confirmation prompt, again via file redirect: piping
          # `echo Y |` would deliver "Y " and uninstall.ps1 compares -ne "Y", so
          # the run would quietly print "Aborted." and exit 0 -- a green step
          # that uninstalled nothing.
          # Plant an UNCLAIMED junction at %USERPROFILE%\TeXLib first: nothing in
          # VERSION points at it, so it stands in for a developer's own link to
          # their real library. The uninstaller must leave it alone.
          $junction = Join-Path $env:USERPROFILE 'TeXLib'
          $target   = Join-Path $env:RUNNER_TEMP 'not-ours'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $target 'canary.txt') -Value 'must survive'
          if (Test-Path $junction) { [System.IO.Directory]::Delete($junction, $false) }
          New-Item -ItemType Junction -Path $junction -Target $target | Out-Null

          # Answers: the top-level confirmation, then the four per-component
          # questions 0.6.3 asks (Sublime / Sumatra / TeX Live, and the library
          # only when it sits outside the install root -- it does not here, so
          # the fourth line is simply unread).
          Set-Content -Encoding ascii -Path confirm.txt -Value "Y`r`nY`r`nY`r`nY"
          $out = & cmd /c "tools\uninstall-console.bat -InstallPath `"$env:INSTALL_ROOT`" < confirm.txt" 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          Write-Host "uninstall-console.bat exit code: $rc"
          if ($out -match 'positional parameter cannot be found') {
            Write-Host "FAIL: the wrapper's stray-`$null splat regressed." -ForegroundColor Red; exit 1
          }
          if ($out -notmatch 'TeXLib-Uninstaller v') {
            Write-Host "FAIL: uninstall.ps1 never got far enough to print its banner." -ForegroundColor Red; exit 1
          }
          if ($out -match 'Aborted\.') {
            Write-Host "FAIL: the confirmation answer did not take; nothing was uninstalled." -ForegroundColor Red; exit 1
          }
          if ($rc -ne 0) { Write-Host "FAIL: uninstall-console.bat exited $rc." -ForegroundColor Red; exit $rc }

          # The junction guard: an unclaimed junction must survive, and its
          # target must be untouched (Directory::Delete(path,$false) never
          # follows the link, but assert it rather than trust it).
          if (-not (Test-Path $junction)) {
            Write-Host "FAIL: the uninstaller removed a junction it did not create." -ForegroundColor Red; exit 1
          }
          if (-not (Test-Path (Join-Path $target 'canary.txt'))) {
            Write-Host "FAIL: the junction target's contents were deleted." -ForegroundColor Red; exit 1
          }
          if ($out -notmatch 'Leaving .*TeXLib in place') {
            Write-Host "FAIL: no explanation printed for the preserved junction." -ForegroundColor Red; exit 1
          }
          # The whole point of 0.6.3's uninstall rework: the components really go.
          # Before it, the Packages\User junction inside the root made
          # Remove-Item -Recurse throw partway through and leave Sublime and
          # SumatraPDF sitting there.
          foreach ($gone in @('Sublime Text','Sumatra','Library')) {
            if (Test-Path (Join-Path $env:INSTALL_ROOT $gone)) {
              Write-Host "FAIL: $gone survived the uninstall." -ForegroundColor Red; exit 1
            }
          }
          Write-Host "OK: uninstall-console.bat removed every component and preserved the unclaimed junction." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 4c. legacy-library-migration — FAST. Covers the 0.6.3 relocation. A machine
  #     whose library is still at the pre-0.6.3 Documents\TeXLib must come out of
  #     an install with the library at <InstallPath>\Library, the user's own
  #     Sublime settings carried across, and the old folder byte-for-byte
  #     untouched. No other job reaches this: they all start from a location the
  #     0.6.3 default already agrees with.
  # ---------------------------------------------------------------------------
  legacy-library-migration:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Seed a pre-0.6.3 machine (library in Documents) plus a bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'TeXLibRoot'
          "INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # The pre-0.6.3 location, carrying a settings file that exists ONLY
          # there: finding it at the new location afterwards is what proves the
          # migration ran, rather than the bundle simply being deployed.
          $legacy = Join-Path $env:USERPROFILE 'Documents\TeXLib'
          "LEGACY_LIB=$legacy" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path (Join-Path $legacy 'Sublime') | Out-Null
          foreach ($p in 'course-metadata','texlib-build','basic-utilities') {
            $sty = "\NeedsTeXFormat{LaTeX2e}`r`n\ProvidesPackage{$p}[2026/01/01 CI stub]`r`n\endinput"
            Set-Content -Encoding UTF8 -Path (Join-Path $legacy "$p.sty") -Value $sty
          }
          Set-Content -Encoding UTF8 -Path (Join-Path $legacy 'Sublime\my-keymap.sublime-keymap') -Value '[{ "//": "user keymap that must survive the move" }]'

          # A real bundle, so the install takes the deploy path and the migration
          # is limited to carrying the user's settings across.
          New-Item -ItemType Directory -Force -Path 'texlib\Sublime' | Out-Null
          Set-Content -Encoding UTF8 -Path 'texlib\CHANGELOG.md' -Value "# Changelog`r`n`r`n## [Unreleased]`r`n- CI stub bundle (not a real release)."
          foreach ($p in 'course-metadata','texlib-build','basic-utilities') {
            $sty = "\NeedsTeXFormat{LaTeX2e}`r`n\ProvidesPackage{$p}[2026/01/01 CI stub]`r`n\endinput"
            Set-Content -Encoding UTF8 -Path ("texlib\{0}.sty" -f $p) -Value $sty
          }
          Set-Content -Encoding UTF8 -Path 'texlib\Sublime\texlib_builder.py' -Value '# CI stub builder.'
          Set-Content -Encoding UTF8 -Path 'texlib\Sublime\TeXLib.sublime-build' -Value '{ "//": "CI stub build." }'

          # Empty component dirs so all four big downloads are skipped.
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $installRoot 'Sublime Text\Data\Packages\LaTeXTools'), `
            (Join-Path $installRoot 'Sublime Text\Data\Lib\python38\regex'), `
            (Join-Path $installRoot 'Sumatra'), `
            (Join-Path $installRoot 'TexLive\2025\bin\windows') | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $installRoot 'Sublime Text\Data\Lib\python38\regex\__init__.py') -Value '# CI stub regex.'

      - name: Install onto the pre-0.6.3 machine (-Silent)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''; $env:OneDriveCommercial = ''; $env:OneDriveConsumer = ''
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -InstallPath $env:INSTALL_ROOT 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($out -notmatch 'pre-0\.6\.3 library') {
            Write-Host "FAIL: the legacy library was never detected; this job is not testing what it claims." -ForegroundColor Red; exit 1
          }
          if ($rc -ne 0) { Write-Host "FAIL: install exited $rc." -ForegroundColor Red; exit $rc }

      - name: Assert the settings moved and the old folder is intact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $new = Join-Path $env:INSTALL_ROOT 'Library'
          if (-not (Test-Path (Join-Path $new 'course-metadata.sty'))) {
            Write-Host "FAIL: no library at $new" -ForegroundColor Red; exit 1
          }
          $keymap = Join-Path $new 'Sublime\my-keymap.sublime-keymap'
          if (-not (Test-Path $keymap)) {
            Write-Host "FAIL: the user's keymap did not come across to $keymap" -ForegroundColor Red; exit 1
          }
          if ((Get-Content $keymap -Raw) -notmatch 'must survive the move') {
            Write-Host "FAIL: the keymap at the new location is not the user's." -ForegroundColor Red; exit 1
          }
          # Non-destructive is the promise: the old tree stays exactly as it was.
          foreach ($f in 'course-metadata.sty','Sublime\my-keymap.sublime-keymap') {
            if (-not (Test-Path (Join-Path $env:LEGACY_LIB $f))) {
              Write-Host "FAIL: the migration removed $f from $env:LEGACY_LIB" -ForegroundColor Red; exit 1
            }
          }
          Write-Host "OK: library relocated, settings carried over, pre-0.6.3 folder intact." -ForegroundColor Green

      - name: Teardown with -All, and assert the old folder still survives
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          # -All is the "remove everything" switch, and it removes everything the
          # INSTALL owns. A pre-0.6.3 folder the installer merely read from is
          # not ours to delete, and must survive even this.
          $out = & cmd /c "tools\uninstall-console.bat -All -Silent -InstallPath `"$env:INSTALL_ROOT`"" 2>&1 | Out-String
          Write-Host $out
          if (Test-Path $env:INSTALL_ROOT) {
            Write-Host "FAIL: -All left $env:INSTALL_ROOT behind." -ForegroundColor Red; exit 1
          }
          if (-not (Test-Path (Join-Path $env:LEGACY_LIB 'course-metadata.sty'))) {
            Write-Host "FAIL: -All deleted the pre-0.6.3 library the installer only read from." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: -All removed the install and left the pre-0.6.3 folder alone." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 4d. junctioned-library-uninstall — FAST. The shape 0.6.4 fixed: a machine
  #     upgraded from <=0.6.2 whose OneDrive path had a comma, so texlib_root is
  #     the %USERPROFILE%\TeXLib JUNCTION and the library is on the far side of
  #     it. Two things have to hold, and 0.6.3 got both wrong in one place:
  #     declining must leave the real library untouched, and accepting must
  #     delete the folder the prompt actually named rather than just the link.
  #     Nothing else covers it -- every other job's library is a real directory.
  # ---------------------------------------------------------------------------
  junctioned-library-uninstall:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Decline the library -- the junction target must survive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sand = Join-Path $env:RUNNER_TEMP 'jlib-decline'
          $root = Join-Path $sand 'root'
          $real = Join-Path $sand 'OneDrive - Fake University, Org\Documents\TeXLib'
          $link = Join-Path $sand 'UserProfile\TeXLib'
          New-Item -ItemType Directory -Force -Path $root, $real, (Split-Path $link -Parent) | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $real 'canary.txt') -Value 'must survive'
          New-Item -ItemType Junction -Path $link -Target $real | Out-Null
          $stamp = @("installer_version=0.6.2", "texlib_root=$link") -join "`r`n"
          Set-Content -Encoding UTF8 -Path (Join-Path $root 'VERSION') -Value $stamp

          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          Set-Content -Encoding ascii -Path answers.txt -Value "Y`r`nn"
          $out = & cmd /c "powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\uninstall.ps1 -InstallPath `"$root`" < answers.txt" 2>&1 | Out-String
          Write-Host $out

          if ($out -match 'PRESERVES') {
            Write-Host "FAIL: the PRESERVES block came back." -ForegroundColor Red; exit 1
          }
          # The prompt must name the TARGET. Naming only the link is how a user
          # says yes to "remove C:\Users\me\TeXLib" and means something else.
          if ($out -notmatch [regex]::Escape($real)) {
            Write-Host "FAIL: the prompt never named the junction target." -ForegroundColor Red; exit 1
          }
          if (-not (Test-Path (Join-Path $real 'canary.txt'))) {
            Write-Host "FAIL: declining the library still destroyed it." -ForegroundColor Red; exit 1
          }
          if (-not (Test-Path $link)) {
            Write-Host "FAIL: declining the library still removed the junction." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: declined, and both the junction and the real library survive." -ForegroundColor Green

      - name: Accept the library -- the junction TARGET must go, not just the link
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sand = Join-Path $env:RUNNER_TEMP 'jlib-accept'
          $root = Join-Path $sand 'root'
          $real = Join-Path $sand 'OneDrive - Fake University, Org\Documents\TeXLib'
          $link = Join-Path $sand 'UserProfile\TeXLib'
          New-Item -ItemType Directory -Force -Path $root, $real, (Split-Path $link -Parent) | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $real 'canary.txt') -Value 'should go'
          New-Item -ItemType Junction -Path $link -Target $real | Out-Null
          $stamp = @("installer_version=0.6.2", "texlib_root=$link") -join "`r`n"
          Set-Content -Encoding UTF8 -Path (Join-Path $root 'VERSION') -Value $stamp

          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          Set-Content -Encoding ascii -Path answers2.txt -Value "Y`r`ny"
          $out = & cmd /c "powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\uninstall.ps1 -InstallPath `"$root`" < answers2.txt" 2>&1 | Out-String
          Write-Host $out

          if (Test-Path $real) {
            Write-Host "FAIL: yes removed only the link; the real library is still there." -ForegroundColor Red; exit 1
          }
          if (Test-Path $link) {
            Write-Host "FAIL: the junction was left dangling." -ForegroundColor Red; exit 1
          }
          # Deleting the library must not take its parent with it.
          if (-not (Test-Path (Split-Path $real -Parent))) {
            Write-Host "FAIL: the library's parent directory was removed too." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: accepted, and exactly the named folder plus the link went." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 4e. repair-mode — FAST. -Repair re-applies configuration to an install that
  #     already exists: no downloads, no components, library untouched. Its whole
  #     value is being the cheap answer to "my associations went weird" or
  #     "Sublime lost the builder", so the things worth asserting are that it
  #     rebuilds what you break, that it stays offline, and that it does not
  #     wander into the library.
  # ---------------------------------------------------------------------------
  repair-mode:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Seed an installed-but-broken machine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'TeXLibRoot'
          "INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $lib = Join-Path $installRoot 'Library'
          "LIB_ROOT=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # A 0.6.3+ layout: library inside the install root, components present.
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $lib 'Sublime\texlib'), `
            (Join-Path $installRoot 'Sublime Text\Data\Packages\LaTeXTools'), `
            (Join-Path $installRoot 'Sublime Text\Data\Lib\python38\regex'), `
            (Join-Path $installRoot 'Sumatra'), `
            (Join-Path $installRoot 'TexLive\2025\bin\windows') | Out-Null
          foreach ($p in 'course-metadata','texlib-build','basic-utilities') {
            $sty = "\NeedsTeXFormat{LaTeX2e}`r`n\ProvidesPackage{$p}[2026/01/01 CI stub]`r`n\endinput"
            Set-Content -Encoding UTF8 -Path (Join-Path $lib "$p.sty") -Value $sty
          }
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'Sublime\texlib_builder.py') -Value '# CI stub builder.'
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'Sublime\texlib\texlib.py')  -Value '# CI stub plugin.'
          Set-Content -Encoding UTF8 -Path (Join-Path $installRoot 'Sublime Text\Data\Lib\python38\regex\__init__.py') -Value '# CI stub regex.'
          Set-Content -Encoding UTF8 -Path (Join-Path $installRoot 'Sublime Text\sublime_text.exe') -Value 'stub'
          # Anything of the user's in the library must come through untouched.
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'CANARY.txt') -Value 'library must not be touched'
          # And the VERSION stamp that tells -Repair there is something to repair.
          $stamp = @("installer_version=0.6.4", "texlib_root=$lib", "sublime_dir=$installRoot\Sublime Text") -join "`r`n"
          Set-Content -Encoding UTF8 -Path (Join-Path $installRoot 'VERSION') -Value $stamp

      - name: install.ps1 -Repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''; $env:OneDriveCommercial = ''; $env:OneDriveConsumer = ''
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Repair -InstallPath $env:INSTALL_ROOT 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) { Write-Host "FAIL: -Repair exited $rc." -ForegroundColor Red; exit $rc }

          # Offline by contract. A -Repair that downloads is just a slow install.
          if ($out -match 'Downloading ') {
            Write-Host "FAIL: -Repair downloaded something." -ForegroundColor Red; exit 1
          }
          if ($out -notmatch 'REPAIR') {
            Write-Host "FAIL: the run did not identify itself as REPAIR mode." -ForegroundColor Red; exit 1
          }
          if ($out -notmatch 'Leaving the TeXLib library') {
            Write-Host "FAIL: -Repair did not say it was leaving the library alone." -ForegroundColor Red; exit 1
          }
          # It has to actually rebuild the configuration.
          $plugin = Join-Path $env:INSTALL_ROOT 'Sublime Text\Data\Packages\TeXLib'
          if (-not (Test-Path (Join-Path $plugin 'texlib.py'))) {
            Write-Host "FAIL: -Repair did not deploy the TeXLib Sublime package." -ForegroundColor Red; exit 1
          }
          $user = Join-Path $env:INSTALL_ROOT 'Sublime Text\Data\Packages\User'
          if ((Get-Item $user -Force).Attributes -notmatch 'ReparsePoint') {
            Write-Host "FAIL: -Repair did not junction Packages\User." -ForegroundColor Red; exit 1
          }
          # Settings land in the library's Sublime\ folder -- the one Packages\User
          # is junctioned to -- not at the library root.
          $ltSettings = Join-Path $env:LIB_ROOT 'Sublime\LaTeXTools.sublime-settings'
          if (-not (Test-Path $ltSettings)) {
            Write-Host "FAIL: -Repair did not write $ltSettings." -ForegroundColor Red; exit 1
          }
          if ((Get-Content $ltSettings -Raw) -notmatch '"builder"\s*:\s*"texlib"') {
            Write-Host "FAIL: the rewritten LaTeXTools settings do not select the texlib builder." -ForegroundColor Red; exit 1
          }
          # The file the LaTeXTools one does NOT stand in for. Ctrl+B runs the
          # native texlib_build command, which reads texinputs from here and
          # nowhere else; through 0.10.1 nothing wrote it and every document
          # failed at \documentclass on a fresh install.
          $tlSettings = Join-Path $env:LIB_ROOT 'Sublime\TeXLib.sublime-settings'
          if (-not (Test-Path $tlSettings)) {
            Write-Host "FAIL: -Repair did not write $tlSettings." -ForegroundColor Red; exit 1
          }
          $tl = Get-Content $tlSettings -Raw
          if ($tl -notmatch '(?m)^\s*"texinputs"\s*:') {
            Write-Host "FAIL: TeXLib.sublime-settings has no ACTIVE texinputs key (commented out is the bug)." -ForegroundColor Red; exit 1
          }
          $libFs = $env:LIB_ROOT.Replace('\', '/').TrimEnd('/')
          if ($tl -notmatch [regex]::Escape('"' + $libFs + '"')) {
            Write-Host "FAIL: texinputs does not contain the library root $libFs." -ForegroundColor Red; exit 1
          }
          # kpathsea only APPENDS its default path at an empty segment; without
          # one TEXINPUTS replaces it and every build fatals at startup.
          if ($tl -notmatch '"texinputs"\s*:\s*\[[^\]]*""\s*\]') {
            Write-Host "FAIL: texinputs does not end in the load-bearing empty segment." -ForegroundColor Red; exit 1
          }
          # And it must not have touched the library it was told to leave alone.
          if (-not (Test-Path (Join-Path $env:LIB_ROOT 'CANARY.txt'))) {
            Write-Host "FAIL: -Repair modified the library." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: -Repair rebuilt the config offline, library untouched." -ForegroundColor Green

      - name: -Repair refuses when there is nothing to repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $empty = Join-Path $env:RUNNER_TEMP 'NoInstallHere'
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Repair -InstallPath $empty 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          # Silently "repairing" a non-existent install would junction
          # Packages\User into a Sublime directory that isn't there.
          if ($rc -eq 0) {
            Write-Host "FAIL: -Repair succeeded against an install that does not exist." -ForegroundColor Red; exit 1
          }
          if ($out -notmatch 'needs an existing install') {
            Write-Host "FAIL: no explanation of why -Repair refused." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: -Repair refused with a clear reason." -ForegroundColor Green
          # The child was SUPPOSED to exit non-zero. Without this, `shell: pwsh`
          # propagates its $LASTEXITCODE and the step fails for passing.
          exit 0

  # ---------------------------------------------------------------------------
  # 4f. self-update-noop — FAST. -Update reaches the GitHub releases API, so the
  #     one thing CI can check cheaply is that the reach-and-compare half works
  #     and correctly decides to do nothing. Guarded on the version comparison:
  #     if this branch is BEHIND the latest release, -Update would legitimately
  #     download and run a real install, which is not something to do in a
  #     10-minute job -- so that case reports and skips rather than failing.
  # ---------------------------------------------------------------------------
  self-update-noop:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Self-update EXECUTES what it downloads (including under -Silent), so a
      # verification failure downgraded to a warning is a remote-code-execution
      # hole, not a UX choice. Three warn-and-run paths shipped that way until
      # 0.12.0; this pins the fail-closed property structurally.
      - name: Self-update verification is fail-closed (no warn-and-run paths)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null; $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools\install.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { $parseErrors | ForEach-Object { Write-Host $_.Message }; exit 1 }
          $fn = $ast.Find({ param($n)
            $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
            $n.Name -eq 'Invoke-SelfUpdate' }, $true)
          if (-not $fn) { Write-Host 'FAIL: Invoke-SelfUpdate not found.' -ForegroundColor Red; exit 1 }
          $text = $fn.Extent.Text
          if ($text -match '(?im)\[WARN\][^\r\n]*(unverified|cannot verify)') {
            Write-Host 'FAIL: a verification failure is a [WARN] inside Invoke-SelfUpdate; it must fail closed.' -ForegroundColor Red
            exit 1
          }
          foreach ($needle in 'ships no SHA256SUMS', 'Could not fetch SHA256SUMS', 'has no line for', 'Hash mismatch') {
            if ($text -notmatch [regex]::Escape($needle)) {
              Write-Host "FAIL: expected verification guard '$needle' is missing from Invoke-SelfUpdate." -ForegroundColor Red
              exit 1
            }
          }
          Write-Host 'OK: all four verification failure modes are fatal in Invoke-SelfUpdate.' -ForegroundColor Green

      - name: install.ps1 -Update decides correctly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'

          $ver = (Select-String -Path .\tools\install.ps1 -Pattern '^\$InstallerVersion\s*=\s*"([^"]+)"' |
                  Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "script version: $ver"
          $latest = ''
          try {
            $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/landonfox00/TeXLib-Installer/releases/latest' `
                                     -Headers @{ 'User-Agent' = 'TeXLib-Installer-CI' } -TimeoutSec 30
            $latest = "$($rel.tag_name)" -replace '^v', ''
          } catch {
            Write-Host "releases API unreachable; skipping (network, not a regression)." -ForegroundColor Yellow; exit 0
          }
          Write-Host "latest release: $latest"

          if ([version]$ver -lt [version]$latest) {
            Write-Host "This branch is behind v$latest, so -Update would run a real install. Skipping." -ForegroundColor Yellow
            exit 0
          }

          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Update 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) { Write-Host "FAIL: -Update exited $rc on the no-op path." -ForegroundColor Red; exit $rc }
          if ($out -notmatch 'Already on the latest release') {
            Write-Host "FAIL: -Update did not take the no-op path." -ForegroundColor Red; exit 1
          }
          if ($out -match 'Downloading ') {
            Write-Host "FAIL: -Update downloaded despite being current." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: -Update reached the API, compared versions, and did nothing." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 4g. config-artifacts — FAST. Everything sections 16-18 actually put on the
  #     machine, none of which was asserted anywhere before: the Start Menu
  #     group, the deployed editor preferences, the SumatraPDF exe resolution,
  #     and shortcut ownership on the way back out. Driven through -Repair
  #     because that runs exactly those sections and nothing else.
  # ---------------------------------------------------------------------------
  config-artifacts:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Seed an install whose SumatraPDF is NEWER than the pinned one
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'TeXLibRoot'
          "INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $lib = Join-Path $installRoot 'Library'
          "LIB_ROOT=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          New-Item -ItemType Directory -Force -Path `
            (Join-Path $lib 'Sublime\texlib'), `
            (Join-Path $installRoot 'Sublime Text\Data\Packages\LaTeXTools'), `
            (Join-Path $installRoot 'Sublime Text\Data\Lib\python38\regex'), `
            (Join-Path $installRoot 'Sumatra'), `
            (Join-Path $installRoot 'TexLive\2025\bin\windows') | Out-Null
          foreach ($p in 'course-metadata','texlib-build','basic-utilities') {
            Set-Content -Encoding UTF8 -Path (Join-Path $lib "$p.sty") -Value "\endinput"
          }
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'Sublime\texlib_builder.py') -Value '# stub'
          Set-Content -Encoding UTF8 -Path (Join-Path $lib 'Sublime\texlib\texlib.py')  -Value '# stub'
          Set-Content -Encoding UTF8 -Path (Join-Path $installRoot 'Sublime Text\Data\Lib\python38\regex\__init__.py') -Value '# stub'
          Set-Content -Encoding UTF8 -Path (Join-Path $installRoot 'Sublime Text\sublime_text.exe') -Value 'stub'
          # The version-named exe is the point: the pinned name is 3.5.2, and a
          # user who answered Skip after a bump has something else. Everything
          # downstream must follow the file that is really there.
          Set-Content -Encoding UTF8 -Path (Join-Path $installRoot 'Sumatra\SumatraPDF-9.9.9-64.exe') -Value 'stub'
          $stamp = @("installer_version=0.7.2", "texlib_root=$lib") -join "`r`n"
          Set-Content -Encoding UTF8 -Path (Join-Path $installRoot 'VERSION') -Value $stamp

          # A shortcut of the USER's, named exactly like ours but pointing
          # somewhere else entirely. The uninstaller must not touch it.
          $desktop = [Environment]::GetFolderPath('Desktop')
          $ws = New-Object -ComObject WScript.Shell
          $sc = $ws.CreateShortcut((Join-Path $desktop 'Sublime.lnk'))
          $sc.TargetPath = "$env:SystemRoot\System32\notepad.exe"
          $sc.Save()

      - name: -Repair, then assert what it put on the machine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''; $env:OneDriveCommercial = ''; $env:OneDriveConsumer = ''
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Repair -InstallPath $env:INSTALL_ROOT 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) { Write-Host "FAIL: -Repair exited $rc" -ForegroundColor Red; exit $rc }

          $fail = 0
          # --- SumatraPDF exe resolution -------------------------------------
          if ($out -notmatch 'SumatraPDF-9\.9\.9-64\.exe') {
            Write-Host "FAIL: the run never mentioned the SumatraPDF actually on disk." -ForegroundColor Red; $fail++
          }
          $lt = Get-Content (Join-Path $env:LIB_ROOT 'Sublime\LaTeXTools.sublime-settings') -Raw
          if ($lt -notmatch 'SumatraPDF-9\.9\.9-64\.exe') {
            Write-Host "FAIL: LaTeXTools viewer points at the pinned exe, not the one installed." -ForegroundColor Red; $fail++
          }
          $prog = 'HKCU:\Software\Classes\TeXLib.SumatraPDF\shell\open\command'
          $cmd = (Get-Item $prog -ErrorAction SilentlyContinue).GetValue('')
          if ($cmd -notmatch 'SumatraPDF-9\.9\.9-64\.exe') {
            Write-Host "FAIL: the .pdf association points at a SumatraPDF that is not installed ($cmd)." -ForegroundColor Red; $fail++
          }

          # --- editor preferences --------------------------------------------
          $prefs = Get-Content (Join-Path $env:LIB_ROOT 'Sublime\Preferences.sublime-settings') -Raw
          # Assert the setting that actually DOES something. build_system pins
          # Ctrl+B to TeXLib's build; LaTeXTools ships a "Compile to PDF" build
          # with the same text.tex.latex selector, so losing this line makes the
          # pick ambiguous and only TeXLib's build exposes the Ctrl+Shift+B mode
          # variants. That is a real, checkable behaviour.
          if ($prefs -notmatch '"build_system"\s*:\s*"Packages/User/TeXLib\.sublime-build"') {
            Write-Host "FAIL: deployed Preferences do not pin Ctrl+B to the TeXLib build system." -ForegroundColor Red; $fail++
          }
          # And assert the dead setting stays dead. Until 0.10.1 this job
          # asserted "update_check": false was PRESENT -- which tested that a
          # string was in a file, not that it did anything, and was green for
          # three releases while the thing it claimed to verify never worked.
          # update_check is a COMMAND (Help -> Check for Updates), not a
          # preference; Sublime 4200's defaults document 196 keys and it is not
          # one of them, and unknown keys are silently ignored.
          # Anchored to the start of a line so it catches a real settings entry
          # and not the template's own comment explaining why it is gone.
          if ($prefs -match '(?m)^\s*"update_check"\s*:') {
            Write-Host "FAIL: 'update_check' is back as a setting in the deployed Preferences. It is a command, not a preference, and does nothing there." -ForegroundColor Red; $fail++
          }

          # --- Start Menu group ----------------------------------------------
          $group = Join-Path ([Environment]::GetFolderPath('StartMenu')) 'Programs\TeXLib'
          foreach ($n in 'Sublime Text (TeXLib).lnk','SumatraPDF (TeXLib).lnk','TeXLib Doctor.lnk') {
            if (-not (Test-Path (Join-Path $group $n))) {
              Write-Host "FAIL: Start Menu group is missing $n" -ForegroundColor Red; $fail++
            }
          }
          # --- Installed Apps entry (0.9.0) ----------------------------------
          $arp = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TeXLib'
          if (-not (Test-Path $arp)) {
            Write-Host "FAIL: no Installed Apps entry was registered." -ForegroundColor Red; $fail++
          } else {
            $p = Get-ItemProperty $arp
            if ($p.InstallLocation -ne $env:INSTALL_ROOT) {
              Write-Host "FAIL: InstallLocation is '$($p.InstallLocation)', expected '$env:INSTALL_ROOT'" -ForegroundColor Red; $fail++
            }
            # Windows uses QuietUninstallString for the one-click Uninstall in
            # Settings; without it that button does nothing useful.
            if ($p.QuietUninstallString -notmatch 'uninstall\.ps1') {
              Write-Host "FAIL: QuietUninstallString does not invoke the uninstaller." -ForegroundColor Red; $fail++
            }
            if ($p.ModifyPath -notmatch '-Repair') {
              Write-Host "FAIL: Modify does not map to -Repair." -ForegroundColor Red; $fail++
            }
          }

          # --- install manifest (0.9.0) --------------------------------------
          if (-not (Test-Path (Join-Path $env:INSTALL_ROOT 'MANIFEST'))) {
            Write-Host "FAIL: no MANIFEST was written." -ForegroundColor Red; $fail++
          }

          if ($fail) { exit 1 }
          Write-Host "OK: exe resolution, preferences, Start Menu group, Installed Apps entry and manifest all correct." -ForegroundColor Green

      - name: -Verify sees a clean install, then notices tampering
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'

          $clean = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Verify -InstallPath $env:INSTALL_ROOT 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $clean
          if ($rc -ne 0) { Write-Host "FAIL: a clean install did not verify (exit $rc)." -ForegroundColor Red; exit 1 }

          # One of each kind of difference, because they mean different things
          # and -Verify reports them separately.
          Set-Content -Encoding UTF8 -Path (Join-Path $env:LIB_ROOT 'course-metadata.sty') -Value '\endinput % tampered'
          Remove-Item (Join-Path $env:LIB_ROOT 'texlib-build.sty') -Force
          Set-Content -Encoding UTF8 -Path (Join-Path $env:LIB_ROOT 'my-notes.tex') -Value 'the user''s own file'

          $dirty = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Verify -InstallPath $env:INSTALL_ROOT 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $dirty
          if ($rc -ne 22) { Write-Host "FAIL: a tampered install exited $rc, expected 22." -ForegroundColor Red; exit 1 }
          foreach ($expect in 'Missing since install','Changed since install','Added since install','my-notes.tex') {
            if ($dirty -notmatch [regex]::Escape($expect)) {
              Write-Host "FAIL: -Verify did not report '$expect'." -ForegroundColor Red; exit 1
            }
          }
          Write-Host "OK: -Verify distinguishes missing, changed and added." -ForegroundColor Green
          # The last child exited 22 ON PURPOSE, and `shell: pwsh` propagates
          # $LASTEXITCODE at the end of a step -- so without this the step fails
          # for passing. Any step whose final child is meant to be non-zero
          # needs the same line.
          exit 0

      - name: texlib.config.json presets, and the command line still wins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          # The config lives at the release root, next to install.bat.
          '{ "TexLiveScheme": "medium", "HideJunction": true }' | Set-Content -Encoding UTF8 -Path .\texlib.config.json

          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Repair -InstallPath $env:INSTALL_ROOT 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'TexLiveScheme=medium') {
            Write-Host "FAIL: the config file's TexLiveScheme was not applied." -ForegroundColor Red; exit 1
          }

          # An explicitly-passed argument must beat the file. Silently
          # overriding what someone typed would be the worst possible behaviour.
          $out2 = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Repair -InstallPath $env:INSTALL_ROOT -TexLiveScheme basic 2>&1 | Out-String
          if ($out2 -match 'TexLiveScheme=medium') {
            Write-Host "FAIL: the config file overrode an explicit -TexLiveScheme." -ForegroundColor Red; exit 1
          }

          # A key that is not an option must be reported, not silently ignored.
          '{ "NotAnOption": 1 }' | Set-Content -Encoding UTF8 -Path .\texlib.config.json
          $out3 = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Repair -InstallPath $env:INSTALL_ROOT 2>&1 | Out-String
          if ($out3 -notmatch 'NotAnOption') {
            Write-Host "FAIL: an unknown config key was ignored without a word." -ForegroundColor Red; exit 1
          }

          # And malformed JSON must warn, not abort the install.
          'not json at all' | Set-Content -Encoding UTF8 -Path .\texlib.config.json
          $out4 = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Repair -InstallPath $env:INSTALL_ROOT 2>&1 | Out-String
          $rc = $LASTEXITCODE
          if ($rc -ne 0) { Write-Host "FAIL: malformed config aborted the install (exit $rc)." -ForegroundColor Red; exit 1 }
          if ($out4 -notmatch 'could not be read') {
            Write-Host "FAIL: malformed config was not reported." -ForegroundColor Red; exit 1
          }
          Remove-Item .\texlib.config.json -Force
          Write-Host "OK: config presets apply, explicit args win, bad input is reported not fatal." -ForegroundColor Green
          exit 0

      - name: Uninstall must not take the user's own shortcut with it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $desktop = [Environment]::GetFolderPath('Desktop')
          $mine = Join-Path $desktop 'Sublime.lnk'

          $out = & cmd /c "tools\uninstall-console.bat -All -Silent -InstallPath `"$env:INSTALL_ROOT`"" 2>&1 | Out-String
          Write-Host $out

          # Same name as the one earlier releases created, different target.
          # Two ways to fail this: the INSTALLER overwriting it (which it did,
          # until 0.8.1 moved the Desktop shortcuts to suffixed names), or the
          # UNINSTALLER deleting it by filename.
          if (-not (Test-Path $mine)) {
            Write-Host "FAIL: a shortcut that was not ours was overwritten or deleted." -ForegroundColor Red; exit 1
          }
          $ws = New-Object -ComObject WScript.Shell
          if ($ws.CreateShortcut($mine).TargetPath -notmatch 'notepad\.exe') {
            Write-Host "FAIL: the user's shortcut was rewritten to point somewhere else." -ForegroundColor Red; exit 1
          }
          $group = Join-Path ([Environment]::GetFolderPath('StartMenu')) 'Programs\TeXLib'
          if (Test-Path $group) {
            Write-Host "FAIL: the Start Menu group survived the uninstall." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: our shortcuts went, the user's stayed." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 4h. upgrade-from-old-release — FAST. The sequence a returning user actually
  #     performs: an install made by an OLD published release, removed by the
  #     CURRENT uninstaller, then re-installed with the current installer. Both
  #     halves are real released ZIPs downloaded from GitHub, not simulations,
  #     because the interesting question is whether today's uninstaller
  #     understands yesterday's on-disk layout -- a thing every other job, which
  #     installs and uninstalls the same version, cannot ask.
  #
  #     v0.6.4 is the baseline: it predates the Sublime plugin deploy, the
  #     manifest, the Installed Apps entry and the dropping of Package Control,
  #     so it exercises the widest gap.
  # ---------------------------------------------------------------------------
  upgrade-from-old-release:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install v0.6.4 from its published ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $sand = Join-Path $env:RUNNER_TEMP 'upgrade'
          $root = Join-Path $sand 'root'
          "UPG_SAND=$sand" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "UPG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path $sand | Out-Null

          $zip = Join-Path $sand 'v064.zip'
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 120 `
            -Uri 'https://github.com/landonfox00/TeXLib-Installer/releases/download/v0.6.4/TeXLib-Installer-v0.6.4.zip' `
            -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $sand 'v064')

          # Seed component dirs so both installers take their already-installed
          # path. Downloading TeX Live twice would make this a 90-minute job to
          # test something that has nothing to do with TeX Live.
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $root 'Sublime Text\Data\Packages\LaTeXTools'), `
            (Join-Path $root 'Sublime Text\Data\Lib\python38\regex'), `
            (Join-Path $root 'Sumatra'), `
            (Join-Path $root 'TexLive\2025\bin\windows') | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $root 'Sublime Text\Data\Lib\python38\regex\__init__.py') -Value '# seed'
          Set-Content -Encoding UTF8 -Path (Join-Path $root 'Sublime Text\sublime_text.exe') -Value 'seed'
          Set-Content -Encoding UTF8 -Path (Join-Path $root 'Sumatra\SumatraPDF-3.5.2-64.exe') -Value 'seed'

          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''; $env:OneDriveCommercial = ''; $env:OneDriveConsumer = ''
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File (Join-Path $sand 'v064\tools\install.ps1') -Silent -Sandbox -InstallPath $root
          $rc = $LASTEXITCODE
          if ($rc -ne 0) { Write-Host "FAIL: the v0.6.4 installer exited $rc." -ForegroundColor Red; exit $rc }

          $v = Get-Content (Join-Path $root 'VERSION') -Raw
          if ($v -notmatch 'installer_version=0\.6\.4') {
            Write-Host "FAIL: the seeded install is not v0.6.4." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: a genuine v0.6.4 install is in place." -ForegroundColor Green

      - name: Remove it with the CURRENT uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\uninstall.ps1 -All -Silent -InstallPath $env:UPG_ROOT 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) { Write-Host "FAIL: uninstall exited $rc." -ForegroundColor Red; exit $rc }
          if (Test-Path $env:UPG_ROOT) {
            Write-Host "FAIL: the v0.6.4 install root survived." -ForegroundColor Red; exit 1
          }
          # The 0.6.3 fix, on a layout built by a version that predates it:
          # Packages\User is a junction into the library, and WinPS 5.1's
          # Remove-Item -Recurse follows those. Unlink first or the removal
          # throws partway and leaves Sublime/Sumatra/TeXLive behind.
          if ($out -notmatch 'Unlinked junction') {
            Write-Host "FAIL: no junction was unlinked before the removal." -ForegroundColor Red; exit 1
          }
          if ($out -match '\[WARN\]') {
            Write-Host "FAIL: the uninstall warned about something." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: today's uninstaller fully removed a v0.6.4 install." -ForegroundColor Green

      - name: Install the current version onto the cleaned machine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:UPG_ROOT
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $root 'Sublime Text\Data\Packages\LaTeXTools'), `
            (Join-Path $root 'Sublime Text\Data\Lib\python38\regex'), `
            (Join-Path $root 'Sumatra'), `
            (Join-Path $root 'TexLive\2025\bin\windows') | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $root 'Sublime Text\Data\Lib\python38\regex\__init__.py') -Value '# seed'
          Set-Content -Encoding UTF8 -Path (Join-Path $root 'Sublime Text\sublime_text.exe') -Value 'seed'
          Set-Content -Encoding UTF8 -Path (Join-Path $root 'Sumatra\SumatraPDF-3.5.2-64.exe') -Value 'seed'

          # The repo carries no texlib\ bundle, so stage a stub one.
          New-Item -ItemType Directory -Force -Path 'texlib\Sublime\texlib' | Out-Null
          Set-Content -Encoding UTF8 -Path 'texlib\CHANGELOG.md' -Value "# Changelog`r`n`r`n## [Unreleased]`r`n- CI stub."
          foreach ($p in 'course-metadata','texlib-build','basic-utilities') {
            Set-Content -Encoding UTF8 -Path ("texlib\{0}.sty" -f $p) -Value '\endinput'
          }
          Set-Content -Encoding UTF8 -Path 'texlib\Sublime\texlib_builder.py' -Value '# stub'
          Set-Content -Encoding UTF8 -Path 'texlib\Sublime\texlib\texlib.py'  -Value '# stub'

          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''; $env:OneDriveCommercial = ''; $env:OneDriveConsumer = ''
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Sandbox -InstallPath $root 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) { Write-Host "FAIL: the current installer exited $rc." -ForegroundColor Red; exit $rc }

          $fail = 0
          if (-not (Test-Path (Join-Path $root 'MANIFEST'))) {
            Write-Host "FAIL: no MANIFEST after the upgrade." -ForegroundColor Red; $fail++
          }
          if (-not (Test-Path (Join-Path $root 'Sublime Text\Data\Packages\TeXLib\texlib.py'))) {
            Write-Host "FAIL: the Sublime plugin was not deployed." -ForegroundColor Red; $fail++
          }
          # Assert on the ACT, not the word -- the completion notes legitimately
          # mention Package Control to say the user may install it themselves.
          if ($out -match 'Downloading Package Control') {
            Write-Host "FAIL: Package Control came back." -ForegroundColor Red; $fail++
          }
          if (Test-Path (Join-Path $root 'Library\Sublime\Package Control.sublime-settings')) {
            Write-Host "FAIL: the author's Package Control settings were deployed." -ForegroundColor Red; $fail++
          }
          if ($fail) { exit 1 }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Verify -InstallPath $root | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "FAIL: -Verify did not pass on the upgraded install." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: v0.6.4 -> current upgrade path is clean." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 5. package-integrity — FAST. Builds an actual release bundle with
  #    make-release.ps1 and asserts it contains every file the four entry
  #    points invoke, catching packaging gaps the other jobs miss because they
  #    run install.ps1 directly. Born from the 2026-06-15 flash-and-die:
  #    make-release omitted tools\install_wrapper.ps1, which the .bat invokes.
  #    (Actually launching the entry points headlessly is flaky -- the
  #    wrapper's Read-Host -- so that path is covered by SMOKE-TEST.md.)
  #    Also guards the 0.11.0 root layout: exactly two .bat files, both GUI.
  # ---------------------------------------------------------------------------
  package-integrity:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Build a release bundle and check its layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # make-release snapshots a texlib library; a stub suffices to check
          # PACKAGING completeness and the shape of the extracted folder.
          $stub = Join-Path $env:RUNNER_TEMP 'texlib-src'
          New-Item -ItemType Directory -Force -Path $stub | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $stub 'CHANGELOG.md') -Value "# Changelog`r`n`r`n## [Unreleased]`r`n- stub"
          $out = Join-Path $env:RUNNER_TEMP 'rel'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\make-release.ps1 -Version 0.0.0-ci -TexLibPath $stub -OutDir $out
          if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: make-release exited $LASTEXITCODE" -ForegroundColor Red; exit 1 }
          $stage = Join-Path $out 'TeXLib-Installer-v0.0.0-ci'

          # Every file the entry points invoke must ship, or the .bat flashes
          # open and dies (PowerShell -File on a missing script). Root .bat ->
          # tools\*-gui.ps1; tools\*-console.bat -> tools\boot_wrapper.ps1 ->
          # tools\install.ps1 / uninstall.ps1.
          $required = @('install.bat','uninstall.bat',
                        'tools\boot_wrapper.ps1','tools\install.ps1','tools\uninstall.ps1',
                        'tools\install-gui.ps1','tools\uninstall-gui.ps1',
                        'tools\install-console.bat','tools\uninstall-console.bat',
                        'templates')
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $stage $_)) }
          if ($missing) { Write-Host "FAIL: bundle missing: $($missing -join ', ')" -ForegroundColor Red; exit 1 }
          # And the .ps1 files must NOT be at the release root: the whole point
          # of tools\ is that a user opening the folder sees only the .bat
          # files, with nothing beside them to mis-click.
          foreach ($r in 'install.ps1','uninstall.ps1','install-gui.ps1','uninstall-gui.ps1') {
            if (Test-Path (Join-Path $stage $r)) {
              Write-Host "FAIL: $r is at the bundle root; it belongs in tools\" -ForegroundColor Red; exit 1
            }
          }
          # EXACTLY two .bat files at the root, and both graphical (0.11.0).
          # The root is the whole first impression: one obvious thing to click
          # per direction. Before 0.11.0 there were four, and the two plainest
          # names were the CONSOLE ones -- so the file a first-time user was
          # likeliest to pick was the one meant for scripting. If a console or
          # -gui suffixed .bat reappears here, that regressed.
          $rootBats = @(Get-ChildItem -Path $stage -File -Filter '*.bat' | Select-Object -ExpandProperty Name | Sort-Object)
          if (($rootBats -join ',') -ne 'install.bat,uninstall.bat') {
            Write-Host "FAIL: bundle root should hold exactly install.bat + uninstall.bat; found: $($rootBats -join ', ')" -ForegroundColor Red; exit 1
          }
          # Both root .bat files must launch the GUI, not boot_wrapper.
          foreach ($b in 'install.bat','uninstall.bat') {
            $body = Get-Content (Join-Path $stage $b) -Raw
            if ($body -notmatch '-gui\.ps1') {
              Write-Host "FAIL: $b at the root does not launch the graphical installer." -ForegroundColor Red; exit 1
            }
          }
          # Build/dev-only tools must NOT ship. make-release.ps1 builds the
          # bundle; dev-install-test.ps1 drives install.ps1 against a seeded
          # sandbox and is useless (and confusing) to an end user.
          foreach ($t in 'make-release.ps1','dev-install-test.ps1') {
            if (Test-Path (Join-Path $stage "tools\$t")) {
              Write-Host "FAIL: $t should not be in the bundle" -ForegroundColor Red; exit 1
            }
          }

          # The library is NOT bundled as of 0.11.0 -- install.ps1 downloads the
          # pinned release. A texlib\ folder reappearing here means make-release
          # started snapshotting a separate repo again, which is the coupling
          # that made every installer release decide which library to freeze.
          if (Test-Path (Join-Path $stage 'texlib')) {
            Write-Host "FAIL: the bundle carries a texlib\ tree; the library is downloaded, not bundled." -ForegroundColor Red; exit 1
          }

          # The pin has to be internally consistent. GitHub names the folder
          # inside a tag archive "<repo>-<tag without the leading v>", and
          # install.ps1 hard-codes that name in $TeXLibZipDir to find the
          # extracted tree. Bump the tag and forget the folder and every install
          # dies after the download, at the one point the user has already
          # waited for a 3 MB fetch. Cheap to assert, so assert it.
          $ps1 = Get-Content (Join-Path $stage 'tools\install.ps1') -Raw
          $tag = [regex]::Match($ps1, 'TeXLib/archive/refs/tags/(?<t>[^"]+)\.zip').Groups['t'].Value
          $dir = [regex]::Match($ps1, '\$TeXLibZipDir\s*=\s*"(?<d>[^"]+)"').Groups['d'].Value
          $ver = [regex]::Match($ps1, '\$TeXLibVersion\s*=\s*"(?<v>[^"]+)"').Groups['v'].Value
          if (-not $tag -or -not $dir -or -not $ver) {
            Write-Host "FAIL: could not read the TeXLib pin out of install.ps1 (tag='$tag' dir='$dir' ver='$ver')" -ForegroundColor Red; exit 1
          }
          if ($dir -ne "TeXLib-$($tag -replace '^v')") {
            Write-Host "FAIL: `$TeXLibZipDir is '$dir' but the pinned tag '$tag' extracts to 'TeXLib-$($tag -replace '^v')'." -ForegroundColor Red; exit 1
          }
          if ($ver -ne $tag) {
            Write-Host "FAIL: `$TeXLibVersion ('$ver') does not match the pinned tag ('$tag')." -ForegroundColor Red; exit 1
          }
          # And RELEASE must record which library this installer will fetch.
          $rel = Get-Content (Join-Path $stage 'RELEASE') -Raw
          # \r? matters: RELEASE is written with CRLF, and .NET's multiline `$`
          # anchors before the \n only -- the \r sits between and the match fails.
          if ($rel -notmatch "(?m)^texlib_pin=$([regex]::Escape($ver))\r?$") {
            Write-Host "FAIL: RELEASE does not record texlib_pin=$ver" -ForegroundColor Red; exit 1
          }
          Write-Host "  TeXLib pin: $ver -> $dir (consistent)" -ForegroundColor Gray

          # The wrapper the console entry points invoke must be a real,
          # parseable script (a missing/corrupt wrapper is exactly what makes a
          # .bat flash open and die).
          $werr = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $stage 'tools\boot_wrapper.ps1'), [ref]$null, [ref]$werr)
          if ($werr) { Write-Host "FAIL: shipped boot_wrapper.ps1 has parse errors" -ForegroundColor Red; exit 1 }
          Write-Host "OK: release bundle is complete and the root holds only the two GUI entry points." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 5b. gui — FAST. install-gui.ps1 is a front-end that reads install.ps1's
  #     console output to drive its progress display, so the coupling that can
  #     rot silently is the PHASE MARKERS: rename a Write-Host banner in
  #     install.ps1 and the GUI still installs correctly but shows a bar that
  #     never moves. Nothing else in CI would notice. This job also loads the
  #     XAML for real (a typo there is a crash on launch, not a warning) and
  #     checks every FindName target resolves.
  # ---------------------------------------------------------------------------
  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Both GUI scripts parse and are ASCII
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in '.\tools\install-gui.ps1', '.\tools\uninstall-gui.ps1') {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$e)
            if ($e) { $e | ForEach-Object { Write-Host "  $($_.Message)" -ForegroundColor Red }; Write-Host "FAIL: $f has parse errors" -ForegroundColor Red; $bad++ }
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $f))
            $n = 0; foreach ($b in $bytes) { if ($b -gt 0x7F) { $n++ } }
            if ($n -gt 0) { Write-Host "FAIL: $f has $n non-ASCII bytes (see encoding-guard)" -ForegroundColor Red; $bad++ }
          }
          # Both GUIs hang all their mutable state off $S. PowerShell variable
          # names are case-INSENSITIVE, so any loop or assignment using $s
          # silently rebinds that hashtable -- which is exactly how a successful
          # uninstall came to be reported as a failure: `foreach ($s in ...)`
          # turned $S into a FileStream mid-tick, the rest of the branch threw,
          # and the catch reported an unknown exit code.
          # The [^#] guards matter: both files EXPLAIN this trap in a comment
          # that necessarily contains the offending text, and a naive match
          # flags the explanation instead of the code. (The update_check
          # assertion tripped over exactly this, one job over.)
          foreach ($f in '.\tools\install-gui.ps1', '.\tools\uninstall-gui.ps1') {
            $src = Get-Content $f -Raw
            if ($src -match '(?m)^[^#\r\n]*foreach\s*\(\s*\$s\s+in\s') {
              Write-Host "FAIL: $f binds `$s in a foreach; that IS `$S (case-insensitive) and clobbers the state hashtable. Use `$st." -ForegroundColor Red
              $bad++
            }
            # -cmatch, case-SENSITIVE, on purpose. Case-insensitively there is
            # no difference between the accident and the legitimate `$S = @{...}`
            # declaration this file must make exactly once -- they are the same
            # variable, which is the whole hazard. A lowercase `$s = ` is the
            # one form that is always a mistake.
            if ($src -cmatch '(?m)^[^#\r\n]*(?<![\w.])\$s\s*=\s') {
              Write-Host "FAIL: $f assigns to lowercase `$s; that IS `$S and clobbers the state hashtable." -ForegroundColor Red
              $bad++
            }
          }
          if ($bad) { exit 1 }
          Write-Host "OK: both parse, ASCII-only, no `$s/`$S collision." -ForegroundColor Green

      - name: XAML loads and every FindName target resolves
        shell: powershell
        run: |
          $code = @'
          Add-Type -AssemblyName PresentationFramework, PresentationCore, WindowsBase, System.Xaml
          $bad = 0
          foreach ($f in '.\tools\install-gui.ps1', '.\tools\uninstall-gui.ps1') {
            $gui = Get-Content $f -Raw
            $s = $gui.IndexOf('<Window'); $e = $gui.IndexOf('</Window>')
            if ($s -lt 0 -or $e -lt 0) { Write-Host "FAIL: no XAML block in $f" -ForegroundColor Red; $bad++; continue }
            $win = [Windows.Markup.XamlReader]::Load((New-Object System.Xml.XmlNodeReader ([xml]$gui.Substring($s, $e - $s + 9))))
            $names = [regex]::Matches($gui, '\$Win\.FindName\("([^"]+)"\)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
            $missing = @($names | Where-Object { $null -eq $win.FindName($_) })
            if ($missing.Count) { Write-Host "FAIL: $f FindName targets absent from its XAML: $($missing -join ', ')" -ForegroundColor Red; $bad++ }
            else { Write-Host "OK: $f XAML loads; all $($names.Count) FindName targets resolve." -ForegroundColor Green }
          }
          if ($bad) { exit 1 }
          '@
          Set-Content -Path "$env:RUNNER_TEMP\gui-xaml.ps1" -Value $code -Encoding UTF8
          # -STA: XamlReader needs a single-threaded apartment.
          powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\gui-xaml.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Phase markers still appear in install.ps1
        shell: powershell
        run: |
          $gui = Get-Content .\tools\install-gui.ps1 -Raw
          $inst = Get-Content .\tools\install.ps1 -Raw
          $ps = $gui.IndexOf('$Phases = @('); $pe = $gui.IndexOf("`n)", $ps)
          if ($ps -lt 0 -or $pe -lt 0) { Write-Host "FAIL: could not find the `$Phases table" -ForegroundColor Red; exit 1 }
          $phases = Invoke-Expression ($gui.Substring($ps, $pe - $ps + 2) -replace '^\$Phases\s*=\s*', '')
          if (-not $phases -or $phases.Count -eq 0) { Write-Host "FAIL: `$Phases table is empty" -ForegroundColor Red; exit 1 }
          # A marker install.ps1 prints literally is checked as a substring. A
          # marker it composes at runtime ("Downloading $($Info.File)...") is
          # nowhere in the source, so those declare an Emit naming the
          # construct that prints them and we check that instead.
          $stale = @($phases | Where-Object {
            $probe = if ($_.Emit) { $_.Emit } else { $_.Match }
            -not $inst.Contains($probe)
          })
          if ($stale.Count) {
            Write-Host "FAIL: these GUI phase markers no longer track install.ps1 --" -ForegroundColor Red
            $stale | ForEach-Object {
              $probe = if ($_.Emit) { "emitter '$($_.Emit)'" } else { "marker '$($_.Match)'" }
              Write-Host "  $probe  (label: $($_.Label))" -ForegroundColor Red
            }
            Write-Host "The GUI would still install correctly but its progress bar would stall." -ForegroundColor Red
            exit 1
          }
          # The three download markers only match because the pinned file names
          # start with these strings. Re-pin to a differently-named artifact and
          # the marker silently stops firing, which is exactly the rot this job
          # exists to catch.
          foreach ($prefix in 'sublime_text', 'SumatraPDF', 'install-tl') {
            if ($inst -notmatch [regex]::Escape("`"File`"") + '\s*=\s*"' + [regex]::Escape($prefix)) {
              Write-Host "FAIL: no pinned download whose File starts with '$prefix'; the GUI's 'Downloading $prefix' marker is dead" -ForegroundColor Red
              exit 1
            }
          }
          # Markers are matched with .Contains, never -like: install.ps1 prints
          # "[TeX Live] finished", and -like would read the brackets as a
          # wildcard character class so that marker could never fire.
          if ($gui -match '\$line\s+-like') {
            Write-Host "FAIL: phase matching uses -like; use .Contains (brackets in markers)" -ForegroundColor Red; exit 1
          }
          Write-Host "OK: all $($phases.Count) phase markers still present in install.ps1." -ForegroundColor Green

      - name: Uninstaller phase markers still appear in uninstall.ps1
        shell: powershell
        run: |
          $gui = Get-Content .\tools\uninstall-gui.ps1 -Raw
          $un  = Get-Content .\tools\uninstall.ps1 -Raw
          $ps = $gui.IndexOf('$Phases = @('); $pe = $gui.IndexOf("`n)", $ps)
          if ($ps -lt 0 -or $pe -lt 0) { Write-Host "FAIL: could not find the `$Phases table" -ForegroundColor Red; exit 1 }
          $phases = Invoke-Expression ($gui.Substring($ps, $pe - $ps + 2) -replace '^\$Phases\s*=\s*', '')
          if (-not $phases -or $phases.Count -eq 0) { Write-Host "FAIL: `$Phases table is empty" -ForegroundColor Red; exit 1 }
          $stale = @($phases | Where-Object { $probe = if ($_.Emit) { $_.Emit } else { $_.Match }; -not $un.Contains($probe) })
          if ($stale.Count) {
            Write-Host "FAIL: these uninstaller phase markers no longer track uninstall.ps1 --" -ForegroundColor Red
            $stale | ForEach-Object { Write-Host "  '$($_.Match)' (label: $($_.Label))" -ForegroundColor Red }
            exit 1
          }
          if ($gui -match '\$line\s+-like') {
            Write-Host "FAIL: phase matching uses -like; use .Contains" -ForegroundColor Red; exit 1
          }
          Write-Host "OK: all $($phases.Count) uninstaller phase markers still present." -ForegroundColor Green

      - name: The GUI uninstaller inverts remove/keep correctly
        shell: powershell
        run: |
          # The tick boxes say "remove X"; the switches say "keep X". Getting
          # that inversion backwards deletes a 6 GB tree someone meant to keep,
          # so it is asserted rather than trusted. Mirrors Start-Uninstall.
          $gui = Get-Content .\tools\uninstall-gui.ps1 -Raw
          foreach ($pair in @(
            @{ Box = 'ChkSublime'; Switch = '-KeepSublime' },
            @{ Box = 'ChkSumatra'; Switch = '-KeepSumatra' },
            @{ Box = 'ChkTexLive'; Switch = '-KeepTeXLive' }
          )) {
            # must be guarded by -not, i.e. UNticked adds the Keep switch
            $rx = 'if \(-not \(\$' + $pair.Box + '\.IsChecked[^)]*\)\)\s*\{\s*\$argList \+= "' + [regex]::Escape($pair.Switch) + '"'
            if ($gui -notmatch $rx) {
              Write-Host "FAIL: $($pair.Box) does not map to $($pair.Switch) via -not (remove/keep inversion)" -ForegroundColor Red; exit 1
            }
          }
          # The library box is the opposite polarity: ticked ADDS -RemoveLibrary.
          if ($gui -notmatch 'if \(\$ChkLibrary\.IsChecked[^)]*\)\s*\{\s*\$argList \+= "-RemoveLibrary"') {
            Write-Host "FAIL: ChkLibrary does not map to -RemoveLibrary when ticked" -ForegroundColor Red; exit 1
          }
          # Nothing may be pre-ticked. A window that opens with a 6 GB tree
          # already marked for deletion is a different thing from one you opt
          # into, and the two mistakes do not cost the same: an unticked box you
          # meant to tick costs a second run; a ticked box you failed to notice
          # costs a multi-hour re-download.
          $s = $gui.IndexOf('<Window'); $e2 = $gui.IndexOf('</Window>')
          $xaml = $gui.Substring($s, $e2 - $s + 9)
          if ($xaml -match 'IsChecked\s*=\s*"[Tt]rue"') {
            Write-Host "FAIL: a checkbox is pre-ticked in the uninstaller XAML." -ForegroundColor Red; exit 1
          }
          if ($gui -match '\$pair\.Box\.IsChecked\s*=\s*\$pair\.Has') {
            Write-Host "FAIL: Update-Detection pre-ticks whatever is installed." -ForegroundColor Red; exit 1
          }
          Write-Host "OK: remove/keep inversion wired correctly; nothing pre-ticked." -ForegroundColor Green

  # ---------------------------------------------------------------------------
  # 6. full-install — SLOW, GATED. Real -Silent install on a clean throwaway VM,
  #    then -Doctor, then uninstall.ps1 -Silent teardown. Never on push: only
  #    the weekly schedule OR a manual dispatch with full=true. TeX Live full
  #    scheme + 2 apps fits well under the 6h job cap.
  # ---------------------------------------------------------------------------
  full-install:
    if: >-
      github.event.schedule == '30 4 * * 1' ||
      (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      # Export INSTALL_ROOT FIRST so it is set even if a later step aborts — the
      # log-upload glob below depends on it. Pre-create it so the FIRST transcript
      # lands in <root>\Logs rather than %TEMP%\TeXLib-Install on a clean VM.
      - name: Export install root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'TeXLibRoot'
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          "INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Assert no texlib bundle is staged (this job downloads the real one)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Through 0.11.0 this step ASSEMBLED a stub texlib\ bundle, because the
          # library shipped inside the release zip and pre-flight 7i needed one.
          # It is now actively harmful: a local texlib\ tree OVERRIDES the pinned
          # download, so the one job billed as the slow REAL install was the only
          # job guaranteed NOT to exercise the library download. It deployed 8
          # stub files, and the end-of-install class-resolution check skipped
          # silently because a stub carries no .cls.
          #
          # A 3.3 MB fetch next to a 6 GB TeX Live install is not what makes this
          # job slow. Guard against the stub creeping back rather than just
          # deleting the step, so the coverage cannot be lost again quietly.
          if (Test-Path 'texlib') {
            Write-Host "FAIL: a texlib\ tree is staged; it would override the pinned download and gut this job's coverage." -ForegroundColor Red
            exit 1
          }
          Write-Host "OK: no local bundle -- the installer will download TeXLib and deploy it for real." -ForegroundColor Green

      - name: Real install (install.ps1 -Silent)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Run the installer exactly as a coworker does: powershell.exe (WinPS
          # 5.1), -Silent so no Read-Host / 'Press Enter' can hang. Null OneDrive
          # for the child so $NeedsUserRootJunction is deterministically false
          # (the load-time junction FATAL exit 12/13 is NOT gated by -Silent).
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''
          $env:OneDriveCommercial = ''
          $env:OneDriveConsumer = ''
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -InstallPath $env:INSTALL_ROOT 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          Write-Host "install.ps1 -Silent exit code: $rc"
          if ($rc -ne 0) { exit $rc }

          # This job exists to be the REAL install, so assert it actually did the
          # real things. Each of these was true-but-unasserted while a stub
          # bundle stood in for the library, and the job still reported success.
          $fail = 0
          if ($out -notmatch 'downloaded and verified') {
            Write-Host "FAIL: the library was not downloaded + hash-verified." -ForegroundColor Red; $fail++
          }
          # The stub deployed 8 files. The real v0.5.0 archive deploys ~271 and
          # holds back ~32; assert the shape rather than exact counts, which
          # move with every library release.
          $m = [regex]::Match($out, 'Library deployed to .+ \((?<n>\d+) files\)')
          if (-not $m.Success -or [int]$m.Groups['n'].Value -lt 100) {
            Write-Host "FAIL: expected a real library deploy (100+ files); saw '$($m.Groups['n'].Value)'." -ForegroundColor Red; $fail++
          }
          if ($out -notmatch 'Held back \d+ dev-only file') {
            Write-Host "FAIL: Copy-LibraryTree held nothing back; the archive's test_*.py should have been filtered." -ForegroundColor Red; $fail++
          }
          # The check that would have caught the original build bug. It skips
          # itself when the library has no .cls, which is exactly what a stub
          # library looked like -- so assert it ran AND passed.
          if ($out -notmatch 'TeXLib classes resolve on the build TEXINPUTS') {
            Write-Host "FAIL: the class-resolution check did not run (or did not pass)." -ForegroundColor Red; $fail++
          }
          if ($fail) { exit 1 }
          Write-Host "OK: real download, real deploy, real filtering, classes resolve." -ForegroundColor Green

      - name: Diagnose install (install.ps1 -Doctor)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Invoke-Doctor ALWAYS ends in Stop-Installer 0 regardless of how many
          # [FAIL] checks it printed, so its exit code has no teeth: capture
          # stdout and fail the step ourselves if Doctor reported any [FAIL].
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $env:OneDrive = ''
          $env:OneDriveCommercial = ''
          $env:OneDriveConsumer = ''
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\install.ps1 -Silent -Doctor -InstallPath $env:INSTALL_ROOT 2>&1 | Out-String
          Write-Host $out
          $rc = $LASTEXITCODE
          Write-Host "install.ps1 -Doctor exit code: $rc"
          if ($rc -ne 0) {
            Write-Host "Doctor exited non-zero ($rc)." -ForegroundColor Red
            exit $rc
          }
          if ($out -match '\[FAIL\]') {
            Write-Host "Doctor reported one or more [FAIL] checks; failing the job." -ForegroundColor Red
            exit 1
          }
          # scheme-full must satisfy every package TeXLib requires. If this ever
          # stops holding, the library gained a dependency that even the full
          # scheme lacks -- worth knowing immediately rather than from a user.
          if ($out -notmatch 'LaTeX packages TeXLib requires are installed') {
            Write-Host "FAIL: Doctor did not confirm TeXLib's LaTeX package requirements." -ForegroundColor Red
            exit 1
          }
          # The regex library must carry its wheel metadata, or a Package Control
          # a user installs later will not see it and will reinstall over the
          # loaded .pyd -- which is what killed a plugin host before 0.8.0.
          $distInfo = Get-ChildItem -Path (Join-Path $env:INSTALL_ROOT 'Sublime Text\Data\Lib\python38') `
                                    -Directory -Filter 'regex-*.dist-info' -ErrorAction SilentlyContinue
          if (-not $distInfo) {
            Write-Host "FAIL: regex was installed without its .dist-info metadata." -ForegroundColor Red
            exit 1
          }
          # And Package Control must NOT be installed (dropped in 0.8.0).
          if (Test-Path (Join-Path $env:INSTALL_ROOT 'Sublime Text\Data\Installed Packages\Package Control.sublime-package')) {
            Write-Host "FAIL: Package Control came back." -ForegroundColor Red
            exit 1
          }
          Write-Host "Doctor reported no [FAIL] checks; packages, regex metadata and no-Package-Control all confirmed." -ForegroundColor Green

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-log-${{ github.run_id }}
          # First-run transcript lands under <root>\Logs because we pre-created
          # the root; glob %TEMP%\TeXLib-Install too as a fallback (dash dir =
          # log dir; underscore dir = scratch, wiped). INSTALL_ROOT is always set.
          path: |
            ${{ env.INSTALL_ROOT }}\Logs\*.log
            ${{ runner.temp }}\TeXLib-Install\*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Teardown (tools\uninstall-console.bat -Silent)
        # Always run so the VM is left clean even if install/Doctor failed.
        # uninstall.ps1 -Silent is fully non-interactive and always exits 0, so
        # it never masks an earlier failure (install/Doctor own pass/fail).
        # -InstallPath (new in 0.6.3) points it at the $RUNNER_TEMP root this job
        # installed to, so the teardown removes the real thing rather than
        # clearing HKCU/PATH/shortcuts and leaving the components behind.
        #
        # Routed through the .bat (not uninstall.ps1 directly) so the ONE job
        # that performs a real install also tears it down through the entry
        # point a user actually double-clicks, wrapper and all. The zero-arg
        # form of this path is covered by reuse-existing-library.
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEXLIB_INSTALLER_WRAPPED = '1'
          $out = & cmd /c "tools\uninstall-console.bat -Silent -InstallPath `"$env:INSTALL_ROOT`"" 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'positional parameter cannot be found') {
            Write-Host "FAIL: wrapper arg forwarding regressed." -ForegroundColor Red; exit 1
          }
          Write-Host "uninstall.ps1 -Silent exit code: $LASTEXITCODE"
          foreach ($gone in @('Sublime Text','Sumatra','Library','TexLive')) {
            if (Test-Path (Join-Path $env:INSTALL_ROOT $gone)) {
              Write-Host "FAIL: $gone survived the silent uninstall." -ForegroundColor Red; exit 1
            }
          }
          Write-Host "OK: silent uninstall removed every component." -ForegroundColor Green
